spring:

  application:
    name: kk-studio

  flyway:
    enabled: false

  datasource:
    # 默认占位；PostgresSpringTestSupport / 集成测试通过 DynamicPropertySource 覆盖
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:1/unused
    username: unused
    password: unused

mybatis:
  mapper-locations: classpath:**/*Mapper.xml
  type-aliases-package: fun.fengwk.kkstudio.**.model
  configuration:
    map-underscore-to-camel-case: true


kk-studio:
  storage:
    s3:
      endpoint: http://minio.test-local:9000
      public-endpoint: https://cdn.test-local
      region: auto
      bucket: test-bucket
      access-key: test-access-key
      secret-key: test-secret-key
  harness:
    runtime:
      workers-enabled: false
      resource-root: target/harness-resources
