syntax = "proto3";

package kkstudio.environment.control;

option java_package = "fun.fengwk.kkstudio.platform.daemon.protocol";
option java_multiple_files = true;
option java_outer_classname = "ControlProto";

// Daemon <-> Studio 控制协议的单一事实源。
//
// <p>wire 使用 protobuf binary，每条外层控制消息带 4 字节 big-endian 长度前缀（长度不含前缀，1..16 MiB）。
// 任意 JSON 载荷始终以原始 JSON string 承载，不映射为 Struct；解码只校验文本，不重新序列化。
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;

  SETTINGS = 1;
  READY = 2;
  HEARTBEAT = 3;
  RUNTIME_STATUS = 4;
  INVOKE = 5;
  STARTED = 6;
  PROGRESS = 7;
  COMPLETED = 8;
  FAILED = 9;
  CANCEL = 10;
  CANCELLED = 11;
  RECOVER = 12;
  RECOVER_NOT_FOUND = 13;
  EXECUTION_EXITED = 14;
  RESOURCE_UPLOAD_REQUEST = 15;
  RESOURCE_UPLOAD_TICKET = 16;
  RESOURCE_UPLOAD_COMMIT = 17;
  TEMPORARY_RESOURCE_POLICY = 18;
  UPDATE = 19;
  UPDATE_RESULT = 20;
  IDE_COMMAND = 21;
  IDE_RESULT = 22;
  IDE_LEASE = 23;
  ERROR = 24;
}

enum OperatingSystem {
  OPERATING_SYSTEM_UNSPECIFIED = 0;
  WINDOWS = 1;
  WSL = 2;
  LINUX = 3;
  MACOS = 4;
}

enum Architecture {
  ARCHITECTURE_UNSPECIFIED = 0;
  AMD64 = 1;
  ARM64 = 2;
}

enum TicketState {
  TICKET_STATE_UNSPECIFIED = 0;
  TICKET_PENDING = 1;
  TICKET_READY = 2;
  TICKET_FAILED = 3;
}

enum UpdatePhase {
  UPDATE_PHASE_UNSPECIFIED = 0;
  UPDATE_ACCEPTED = 1;
  UPDATE_PREPARED = 2;
  UPDATE_FAILED = 3;
}

enum IdeAction {
  IDE_ACTION_UNSPECIFIED = 0;
  OPEN_VIEW = 1;
  CHANGE_DIRECTORY = 2;
  FOCUS_TERMINAL = 3;
  CLOSE_VIEW = 4;
  DETACH_VIEW = 5;
  LIST_VIEWS = 6;
}

enum IdeOpenMode {
  IDE_OPEN_MODE_UNSPECIFIED = 0;
  CREATE = 1;
  RESUME = 2;
}

enum IdeViewState {
  IDE_VIEW_STATE_UNSPECIFIED = 0;
  OPEN = 1;
  CLOSING = 2;
}

message Envelope {
  MessageType message_type = 1;
  optional string environment_id = 2;
  optional string invocation_id = 3;

  oneof payload {
    Settings settings = 4;
    Ready ready = 5;
    Heartbeat heartbeat = 6;
    RuntimeStatus runtime_status = 7;
    Invoke invoke = 8;
    Started started = 9;
    Progress progress = 10;
    Completed completed = 11;
    Failed failed = 12;
    Cancel cancel = 13;
    Cancelled cancelled = 14;
    Recover recover = 15;
    RecoverNotFound recover_not_found = 16;
    ExecutionExited execution_exited = 17;
    ResourceUploadRequest resource_upload_request = 18;
    ResourceUploadTicket resource_upload_ticket = 19;
    ResourceUploadCommit resource_upload_commit = 20;
    TemporaryResourcePolicy temporary_resource_policy = 21;
    Update update = 22;
    UpdateResult update_result = 23;
    IdeCommand ide_command = 24;
    IdeResult ide_result = 25;
    IdeLease ide_lease = 26;
    Error error = 27;
  }
}

// HTTP 426 升级拒绝的 protobuf 载荷。
message UpgradeRequired {
  optional int32 target_protocol_version = 1;
  optional string artifact_url = 2;
  optional string artifact_sha256 = 3;
}

message Settings {
  ResourceBudgets resource_budgets = 1;
  optional string display_name = 2;
}

message ResourceBudgets {
  optional int64 max_resource_bytes = 1;
  optional int64 temporary_resource_ttl_seconds = 2;
  optional int64 temporary_resource_cleanup_interval_seconds = 3;
}

message Ready {
  optional string daemon_version = 1;
  EnvironmentInfo environment = 2;
  RuntimeSnapshot runtime_status = 3;
}

message EnvironmentInfo {
  OperatingSystem operating_system = 1;
  Architecture architecture = 2;
  optional string time_zone = 3;
  optional string user_name = 4;
  optional string home_directory = 5;
  optional string note = 6;
  optional string temp_directory = 7;
}

message Heartbeat {
  RuntimeSnapshot runtime_status = 1;
  optional int64 ide_lease_round = 2;
}

message RuntimeStatus {
  RuntimeSnapshot runtime_status = 1;
}

message RuntimeSnapshot {
  optional int64 revision = 1;
  RuntimeBody status = 2;
}

message RuntimeBody {
  optional string daemon_version = 1;
  UpdateProgress update = 2;
}

message UpdateProgress {
  optional string target_version = 1;
  optional int64 downloaded_bytes = 2;
  optional int64 total_bytes = 3;
}

message Invoke {
  optional string capability_id = 1;
  optional string arguments_json = 2;
  optional int64 timeout_millis = 3;
  optional ExpectedFile expected_file = 4;
}

message ExpectedFile {
  optional string path = 1;
  optional string sha256 = 2;
}

message Started {
  optional bool replayed = 1;
}

message Progress {
  optional CapabilityResult result = 1;
}

message Completed {
  optional CapabilityResult result = 1;
}

message CapabilityResult {
  optional string call_id = 1;
  optional bool error = 2;
  optional string details_json = 3;
  repeated Content contents = 4;
}

message Content {
  oneof body {
    TextContent text = 1;
    JsonContent json = 2;
    ResourceContent resource = 3;
  }
}

message TextContent {
  optional string text = 1;
}

message JsonContent {
  optional string json = 1;
}

message ResourceContent {
  optional string upload_id = 1;
  optional string media_type = 2;
  optional string name = 3;
  optional int64 size = 4;
  optional string sha256 = 5;
  optional string preview = 6;
}

message Failed {
  optional string message = 1;
}

message Cancel {}

message Cancelled {
  optional string reason = 1;
}

message Recover {}

message RecoverNotFound {}

message ExecutionExited {}

message ResourceUploadRequest {
  optional string transfer_id = 1;
  optional string media_type = 2;
  optional string name = 3;
  optional int64 size = 4;
  optional string sha256 = 5;
}

message ResourceUploadTicket {
  optional string transfer_id = 1;
  TicketState state = 2;
  optional string upload_id = 3;
  PresignedPut presigned_put = 4;
  optional string message = 5;
}

message PresignedPut {
  optional string method = 1;
  optional string url = 2;
  map<string, string> headers = 3;
  optional string expires_at = 4;
}

message ResourceUploadCommit {
  optional string transfer_id = 1;
  optional string upload_id = 2;
}

message TemporaryResourcePolicy {
  optional int64 temporary_resource_ttl_seconds = 1;
  optional int64 temporary_resource_cleanup_interval_seconds = 2;
}

message Update {
  optional string operation_id = 1;
  optional string target_version = 2;
  reserved 3, 4;
  reserved "artifact_url", "artifact_sha256";
}

message UpdateResult {
  optional string operation_id = 1;
  UpdatePhase phase = 2;
  optional string message = 3;
}

message IdeCommand {
  IdeAction action = 1;
  optional string view_id = 2;
  optional string document_id = 3;
  optional string event_node_id = 4;
  optional string connection_id = 5;
  optional string claim_id = 6;
  optional int64 binding_epoch = 7;
  IdeOpenMode mode = 8;
  optional string directory = 9;
  optional bool discard = 10;
}

message IdeResult {
  optional bool ok = 1;
  optional string code = 2;
  optional string message = 3;
  optional string view_id = 4;
  optional string document_id = 5;
  optional string event_node_id = 6;
  optional string connection_id = 7;
  optional string claim_id = 8;
  optional int64 binding_epoch = 9;
  optional string directory = 10;
  optional string workspace_path = 11;
  repeated IdeViewSummary views = 12;
}

message IdeViewSummary {
  optional string view_id = 1;
  optional string document_id = 2;
  optional string event_node_id = 3;
  optional string connection_id = 4;
  optional string claim_id = 5;
  optional int64 binding_epoch = 6;
  optional string directory = 7;
  optional string workspace_path = 8;
  IdeViewState state = 9;
}

message IdeLease {
  optional int64 round = 1;
  repeated IdeLeaseBinding bindings = 2;
}

message IdeLeaseBinding {
  optional string view_id = 1;
  optional string document_id = 2;
  optional int64 binding_epoch = 3;
}

message Error {
  optional string message = 1;
}
