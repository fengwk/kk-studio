<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Composer Controls Row Harness</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101412;
        color: #edf2ed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* Composer 停在底部，横向占满视口：与 Thread 面板 390 宽的真实行宽一致。 */
      .composer-controls-harness {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./composer-controls-harness.tsx"></script>
  </body>
</html>
