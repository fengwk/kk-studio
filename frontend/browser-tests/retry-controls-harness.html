<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retry Controls Layout Harness</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #101412;
        color: #edf2ed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .harness-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .harness-card {
        background: #171c19;
        border: 1px solid #2b342f;
        border-radius: 8px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .harness-card h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: #edf2ed;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./retry-controls-harness.tsx"></script>
  </body>
</html>
