<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Composer Focus Menu React Browser Harness</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #101412;
        color: #edf2ed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .harness-container {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
      }
      .harness-topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #2a342e;
      }
      .harness-topbar button {
        background: #1f2a24;
        color: #d1ded4;
        border: 1px solid #33443a;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      .harness-topbar button:focus {
        outline: 2px solid #589b71;
      }
      .harness-panes {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .pane-box {
        border: 1px solid #2a342e;
        border-radius: 8px;
        padding: 16px;
        background: #161c18;
      }
      .pane-header {
        font-size: 13px;
        color: #8da494;
        margin-bottom: 8px;
      }
      .modal-backdrop-test {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal-content-test {
        background: #1a221d;
        border: 1px solid #33443a;
        padding: 24px;
        border-radius: 8px;
        min-width: 320px;
      }
      .debug-output {
        font-family: monospace;
        font-size: 12px;
        background: #0d110f;
        padding: 8px 12px;
        border-radius: 4px;
        color: #79c093;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./composer-harness.tsx"></script>
  </body>
</html>
