<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mutation Review Real Browser Harness</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #101412;
        color: #edf2ed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .mutation-harness-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      .mutation-harness-bar {
        padding: 6px 16px;
        background: #181d1a;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 13px;
        color: #94a3b8;
        flex-shrink: 0;
      }
      .mutation-harness-content {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 100%;
      }
      .mutation-pane {
        width: 100%;
        max-width: 100%;
        background: #141916;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        padding: 12px;
        overflow-x: hidden;
      }
      .mutation-approval-pane {
        width: 100%;
        max-width: 100%;
        background: #181d1a;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./mutation-review-harness.tsx"></script>
  </body>
</html>
