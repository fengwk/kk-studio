<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDE Overlay Real Browser Harness</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #101412;
        color: #edf2ed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .harness-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
      }
      .harness-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: #181d1a;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        flex-shrink: 0;
      }
      .harness-panes {
        display: flex;
        flex: 1 1 0;
        min-height: 0;
        padding: 16px;
        gap: 16px;
        background: #101412;
      }
      .test-chat-pane {
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #141916;
        border-radius: 6px;
        overflow: hidden;
      }
      .test-chat-pane-body {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
      }
      .test-pane-composer {
        margin-top: auto;
        display: flex;
        gap: 8px;
      }
      .test-pane-composer textarea {
        flex: 1;
        min-height: 60px;
        background: #1c2420;
        color: #edf2ed;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 8px;
        border-radius: 4px;
        resize: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./ide-overlay-harness.tsx"></script>
  </body>
</html>
