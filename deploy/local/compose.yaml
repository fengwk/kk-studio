name: kk-studio-local

# Single-command local stack: app + PostgreSQL. No Nginx, no separate
# frontend container -- the Spring Boot Fat JAR serves the React build output
# from classpath:/static and falls back to index.html for SPA BrowserRouter
# refreshes (see web/src/main/java/fun/fengwk/kkstudio/web/SpaFallbackConfig.java).
#
# Default host ports can be overridden via environment variables, useful for
# running a second smoke stack in parallel. NOTE: container-internal ports are
# always the defaults below; the env vars only shift the host-side mapping.
#   KK_STUDIO_APP_PORT     (default 8080) -- host port mapped to app container 8080
#   KK_STUDIO_APP_HOST     (default 127.0.0.1) -- host bind address for app
#   KK_STUDIO_PG_PORT      (default 5432)  -- host port mapped to PG container 5432
#   KK_STUDIO_PG_HOST      (default 127.0.0.1) -- host bind address for PG
#   KK_STUDIO_PG_DATABASE / KK_STUDIO_PG_USER / KK_STUDIO_PG_PASSWORD
#   KK_STUDIO_SPRING_PROFILES_ACTIVE (default dev)
#   KK_STUDIO_MODEL_MAX_CONCURRENCY (default 16) -- in-process Model invocation cap
#   KK_STUDIO_TOOL_MAX_CONCURRENCY (default 64) -- in-process Tool invocation cap
#   KK_STUDIO_SUBAGENT_MAX_CONCURRENCY (default 10) -- fixed Subagent task capacity
#   KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_MESSAGE_BYTES (default 16777216) -- inbound frame cap
#   KK_STUDIO_ENVIRONMENT_GATEWAY_QUEUE_CAPACITY (default 256) -- outbound frame queue cap
#   KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_BYTES (default 16777216) -- outbound UTF-8 byte cap
#   KK_STUDIO_ENVIRONMENT_GATEWAY_SEND_TIMEOUT (default 10s) -- outbound per-frame timeout

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KK_STUDIO_PG_DATABASE:-kk_studio}
      POSTGRES_USER: ${KK_STUDIO_PG_USER:-kk_studio}
      POSTGRES_PASSWORD: ${KK_STUDIO_PG_PASSWORD:-kk_studio}
    ports:
      - "${KK_STUDIO_PG_HOST:-127.0.0.1}:${KK_STUDIO_PG_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${KK_STUDIO_PG_USER:-kk_studio} -d ${KK_STUDIO_PG_DATABASE:-kk_studio}
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Durable facts: persisted across `down`; wiped only by `down -v`.
      - kk-studio-postgres:/var/lib/postgresql/data

  app:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    image: kk-studio-app:local
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: ${KK_STUDIO_SPRING_PROFILES_ACTIVE:-dev}
      KK_STUDIO_DB_URL: jdbc:postgresql://postgres:5432/${KK_STUDIO_PG_DATABASE:-kk_studio}
      KK_STUDIO_DB_USER: ${KK_STUDIO_PG_USER:-kk_studio}
      KK_STUDIO_DB_PASSWORD: ${KK_STUDIO_PG_PASSWORD:-kk_studio}
      KK_STUDIO_MODEL_MAX_CONCURRENCY: ${KK_STUDIO_MODEL_MAX_CONCURRENCY:-16}
      KK_STUDIO_TOOL_MAX_CONCURRENCY: ${KK_STUDIO_TOOL_MAX_CONCURRENCY:-64}
      KK_STUDIO_SUBAGENT_MAX_CONCURRENCY: ${KK_STUDIO_SUBAGENT_MAX_CONCURRENCY:-10}
      KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_MESSAGE_BYTES: ${KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_MESSAGE_BYTES:-16777216}
      KK_STUDIO_ENVIRONMENT_GATEWAY_QUEUE_CAPACITY: ${KK_STUDIO_ENVIRONMENT_GATEWAY_QUEUE_CAPACITY:-256}
      KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_BYTES: ${KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_BYTES:-16777216}
      KK_STUDIO_ENVIRONMENT_GATEWAY_SEND_TIMEOUT: ${KK_STUDIO_ENVIRONMENT_GATEWAY_SEND_TIMEOUT:-10s}
    # Container-internal port is fixed at 8080 (server.port=8080 in
    # web/src/main/resources/application.yml; matching the Dockerfile
    # HEALTHCHECK). Only the host-side mapping is overridable.
    ports:
      - "${KK_STUDIO_APP_HOST:-127.0.0.1}:${KK_STUDIO_APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/actuator/health
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  kk-studio-postgres:
