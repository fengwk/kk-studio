name: kk-studio-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kk_studio
      POSTGRES_USER: kk_studio
      POSTGRES_PASSWORD: kk_studio
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kk_studio -d kk_studio"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - kk-studio-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  kk-studio-postgres:
