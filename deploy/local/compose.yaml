name: kk-studio-local

# Single-command local stack: app + PostgreSQL + MinIO. No Nginx, no separate
# frontend container -- the Spring Boot Fat JAR serves the React build output
# from classpath:/static and falls back to index.html for SPA BrowserRouter
# refreshes (see web/src/main/java/fun/fengwk/kkstudio/web/SpaFallbackConfig.java).
#
# Host mappings and deployment-level app capacities can be overridden via
# environment variables. Container-internal ports remain fixed; only the
# *_HOST and *_PORT variables shift host-side mappings.
#   KK_STUDIO_APP_PORT     (default 8080) -- host port mapped to app container 8080
#   KK_STUDIO_APP_HOST     (default 127.0.0.1) -- host bind address for app
#   KK_STUDIO_PG_PORT      (default 5432)  -- host port mapped to PG container 5432
#   KK_STUDIO_PG_HOST      (default 127.0.0.1) -- host bind address for PG
#   KK_STUDIO_PG_DATABASE / KK_STUDIO_PG_USER / KK_STUDIO_PG_PASSWORD
#   KK_STUDIO_S3_PORT      (default 9000)  -- host port mapped to MinIO container 9000
#   KK_STUDIO_S3_HOST      (default 127.0.0.1) -- host bind address for MinIO
#   KK_STUDIO_S3_PUBLIC_HOST (default 127.0.0.1) -- browser-reachable MinIO host advertised in presigned URLs
#   KK_STUDIO_S3_BUCKET / KK_STUDIO_S3_ACCESS_KEY / KK_STUDIO_S3_SECRET_KEY / KK_STUDIO_S3_REGION
#   KK_STUDIO_SPRING_PROFILES_ACTIVE (default dev)
#   KK_STUDIO_HARNESS_DISPATCHER_MAX_DISPATCH_TASKS (default 64)
#   KK_STUDIO_HARNESS_DISPATCHER_LEASE_DURATION (default 30s)
#   KK_STUDIO_HARNESS_DISPATCHER_POLL_INTERVAL (default 1s)
#   KK_STUDIO_HARNESS_DISPATCHER_REJECTION_DELAY (default 1s)
#   KK_STUDIO_HARNESS_DISPATCHER_WORKER_CONCURRENCY (default 16)
#   KK_STUDIO_HARNESS_DISPATCHER_WORKER_QUEUE_CAPACITY (default 64)
#   KK_STUDIO_MODEL_MAX_CONCURRENCY (default 16) -- in-process Model invocation cap
#   KK_STUDIO_TOOL_MAX_CONCURRENCY (default 64) -- in-process Tool invocation cap
#   KK_STUDIO_SUBAGENT_MAX_CONCURRENCY (default 10) -- fixed Subagent task capacity
#   KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_MESSAGE_BYTES (default 16777216) -- inbound frame cap
#   KK_STUDIO_ENVIRONMENT_GATEWAY_QUEUE_CAPACITY (default 256) -- outbound frame queue cap
#   KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_BYTES (default 16777216) -- outbound UTF-8 byte cap
#   KK_STUDIO_ENVIRONMENT_GATEWAY_SEND_TIMEOUT (default 10s) -- outbound per-frame timeout

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KK_STUDIO_PG_DATABASE:-kk_studio}
      POSTGRES_USER: ${KK_STUDIO_PG_USER:-kk_studio}
      POSTGRES_PASSWORD: ${KK_STUDIO_PG_PASSWORD:-kk_studio}
    ports:
      - "${KK_STUDIO_PG_HOST:-127.0.0.1}:${KK_STUDIO_PG_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${KK_STUDIO_PG_USER:-kk_studio} -d ${KK_STUDIO_PG_DATABASE:-kk_studio}
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Durable facts: persisted across `down`; wiped only by `down -v`.
      - kk-studio-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KK_STUDIO_S3_ACCESS_KEY:-kk-studio}
      MINIO_ROOT_PASSWORD: ${KK_STUDIO_S3_SECRET_KEY:-kk-studio}
    ports:
      - "${KK_STUDIO_S3_HOST:-127.0.0.1}:${KK_STUDIO_S3_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - kk-studio-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${KK_STUDIO_S3_ACCESS_KEY:-kk-studio}
      MINIO_ROOT_PASSWORD: ${KK_STUDIO_S3_SECRET_KEY:-kk-studio}
      MINIO_BUCKET: ${KK_STUDIO_S3_BUCKET:-kk-studio}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        mc stat "local/$${MINIO_BUCKET}"
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "mc stat \"local/$${MINIO_BUCKET}\" >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    image: kk-studio-app:local
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: ${KK_STUDIO_SPRING_PROFILES_ACTIVE:-dev}
      KK_STUDIO_DB_URL: jdbc:postgresql://postgres:5432/${KK_STUDIO_PG_DATABASE:-kk_studio}
      KK_STUDIO_DB_USER: ${KK_STUDIO_PG_USER:-kk_studio}
      KK_STUDIO_DB_PASSWORD: ${KK_STUDIO_PG_PASSWORD:-kk_studio}
      KK_STUDIO_STORAGE_S3_ENDPOINT: http://minio:9000
      KK_STUDIO_STORAGE_S3_PUBLIC_ENDPOINT: http://${KK_STUDIO_S3_PUBLIC_HOST:-127.0.0.1}:${KK_STUDIO_S3_PORT:-9000}
      KK_STUDIO_STORAGE_S3_REGION: ${KK_STUDIO_S3_REGION:-us-east-1}
      KK_STUDIO_STORAGE_S3_BUCKET: ${KK_STUDIO_S3_BUCKET:-kk-studio}
      KK_STUDIO_STORAGE_S3_ACCESS_KEY: ${KK_STUDIO_S3_ACCESS_KEY:-kk-studio}
      KK_STUDIO_STORAGE_S3_SECRET_KEY: ${KK_STUDIO_S3_SECRET_KEY:-kk-studio}
      KK_STUDIO_HARNESS_DISPATCHER_MAX_DISPATCH_TASKS: ${KK_STUDIO_HARNESS_DISPATCHER_MAX_DISPATCH_TASKS:-64}
      KK_STUDIO_HARNESS_DISPATCHER_LEASE_DURATION: ${KK_STUDIO_HARNESS_DISPATCHER_LEASE_DURATION:-30s}
      KK_STUDIO_HARNESS_DISPATCHER_POLL_INTERVAL: ${KK_STUDIO_HARNESS_DISPATCHER_POLL_INTERVAL:-1s}
      KK_STUDIO_HARNESS_DISPATCHER_REJECTION_DELAY: ${KK_STUDIO_HARNESS_DISPATCHER_REJECTION_DELAY:-1s}
      KK_STUDIO_HARNESS_DISPATCHER_WORKER_CONCURRENCY: ${KK_STUDIO_HARNESS_DISPATCHER_WORKER_CONCURRENCY:-16}
      KK_STUDIO_HARNESS_DISPATCHER_WORKER_QUEUE_CAPACITY: ${KK_STUDIO_HARNESS_DISPATCHER_WORKER_QUEUE_CAPACITY:-64}
      KK_STUDIO_MODEL_MAX_CONCURRENCY: ${KK_STUDIO_MODEL_MAX_CONCURRENCY:-16}
      KK_STUDIO_TOOL_MAX_CONCURRENCY: ${KK_STUDIO_TOOL_MAX_CONCURRENCY:-64}
      KK_STUDIO_SUBAGENT_MAX_CONCURRENCY: ${KK_STUDIO_SUBAGENT_MAX_CONCURRENCY:-10}
      KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_MESSAGE_BYTES: ${KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_MESSAGE_BYTES:-16777216}
      KK_STUDIO_ENVIRONMENT_GATEWAY_QUEUE_CAPACITY: ${KK_STUDIO_ENVIRONMENT_GATEWAY_QUEUE_CAPACITY:-256}
      KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_BYTES: ${KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_BYTES:-16777216}
      KK_STUDIO_ENVIRONMENT_GATEWAY_SEND_TIMEOUT: ${KK_STUDIO_ENVIRONMENT_GATEWAY_SEND_TIMEOUT:-10s}
    # Container-internal port is fixed at 8080 (server.port=8080 in
    # web/src/main/resources/application.yml; matching the Dockerfile
    # HEALTHCHECK). Only the host-side mapping is overridable.
    ports:
      - "${KK_STUDIO_APP_HOST:-127.0.0.1}:${KK_STUDIO_APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/actuator/health
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  kk-studio-postgres:
  kk-studio-minio:
