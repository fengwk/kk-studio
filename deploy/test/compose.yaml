name: kk-studio-canvas-test

# This stack is intentionally local-only:
# - host ports bind to 127.0.0.1;
# - services share a dedicated project network, isolated from other stacks;
# - all credentials below are fixed, disposable test values.
services:
  postgres: &postgres
    profiles: ["canvas-test", "app"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: canvas_test
      POSTGRES_USER: canvas_test
      POSTGRES_PASSWORD: canvas_test_only
    ports:
      - "127.0.0.1:${CANVAS_TEST_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas_test -d canvas_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - canvas-test

  minio: &minio
    profiles: ["canvas-test", "app"]
    # Verified community fork; source/revision and platform: ../dependencies/minio-client/README.md.
    image: fengwk/minio@sha256:ea0a48a13c701cf2c4397b3a9c0fe9e10ed65b2f58f056bf07e2ce7308123535
    platform: linux/amd64
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: canvas-test
      MINIO_ROOT_PASSWORD: canvas-test-only
    ports:
      - "127.0.0.1:${CANVAS_TEST_MINIO_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data
    networks:
      - canvas-test

  # One-shot bucket bootstrap: create the private bucket, then exit 0. Consumers
  # gate on `service_completed_successfully`; without that condition `up --wait`
  # would reject the container the moment it exits.
  minio-init: &minio-init
    profiles: ["canvas-test", "app"]
    build:
      context: ../dependencies/minio-client
    image: kk-studio-minio-client:RELEASE.2025-04-16T18-13-26Z
    pull_policy: build
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: canvas-test
      MINIO_ROOT_PASSWORD: canvas-test-only
      MINIO_BUCKET: canvas-test
    entrypoint: ["/bin/sh", "/usr/local/bin/init-bucket.sh"]
    networks:
      - canvas-test

  http-mock:
    profiles: ["canvas-test", "app"]
    image: node:22-alpine
    init: true
    read_only: true
    command:
      [
        "node",
        "/mock/server.mjs",
        "--routes",
        "/config/routes.json",
        "--opencli-fake-fixtures",
        "/fixtures"
      ]
    ports:
      - "127.0.0.1:${CANVAS_TEST_MOCK_PORT:-18089}:8080"
    volumes:
      - ./mock/server.mjs:/mock/server.mjs:ro
      - ${CANVAS_TEST_MOCK_ROUTES:-./mock/routes.json}:/config/routes.json:ro
      - ../../apps/canvas/runtime/src/main/resources/fun/fengwk/kkstudio/canvas/infra/function/fake:/fixtures:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:8080/health", { signal: AbortSignal.timeout(2000) })
          .then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      canvas-test:
        aliases:
          - stub.local
          - opencli-hub
          - comfyui

  app:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    image: ${CANVAS_TEST_APP_IMAGE:-kk-studio-app:canvas-test}
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev,canvas-test
      KK_STUDIO_DB_URL: jdbc:postgresql://postgres:5432/canvas_test
      KK_STUDIO_DB_USER: canvas_test
      KK_STUDIO_DB_PASSWORD: canvas_test_only
      KK_STUDIO_STORAGE_S3_ENDPOINT: http://minio:9000
      KK_STUDIO_STORAGE_S3_PUBLIC_ENDPOINT: http://127.0.0.1:${CANVAS_TEST_MINIO_PORT:-19000}
      KK_STUDIO_STORAGE_S3_REGION: us-east-1
      KK_STUDIO_STORAGE_S3_BUCKET: canvas-test
      KK_STUDIO_STORAGE_S3_ACCESS_KEY: canvas-test
      KK_STUDIO_STORAGE_S3_SECRET_KEY: canvas-test-only
      KK_STUDIO_STORAGE_MEDIA_FFPROBE_BINARY: ffprobe
      KK_STUDIO_STORAGE_MEDIA_FFMPEG_BINARY: ffmpeg
      KK_STUDIO_STORAGE_MEDIA_TEMP_DIR: /tmp
      KK_STUDIO_CANVAS_FUNCTION_FAKE_ENABLED: "true"
      KK_STUDIO_EXIT_CONFIRMATION_DIRECTORY: /app/execution-exits
    ports:
      - "127.0.0.1:${CANVAS_TEST_APP_PORT:-18088}:8080"
    volumes:
      - execution-exits:/app/execution-exits
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      http-mock:
        condition: service_healthy
    networks:
      - canvas-test

  reliability-postgres:
    <<: *postgres
    profiles: ["reliability"]
    environment:
      POSTGRES_DB: kk_studio_reliability
      POSTGRES_USER: kk_studio
      POSTGRES_PASSWORD: kk_studio
    ports: []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kk_studio -d kk_studio_reliability"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      reliability:
        aliases: [postgres]

  reliability-minio:
    <<: *minio
    profiles: ["reliability"]
    environment:
      MINIO_ROOT_USER: kk-studio-reliability
      MINIO_ROOT_PASSWORD: kk-studio-reliability-only
    ports:
      - "127.0.0.1:${RELIABILITY_MINIO_PORT:-19002}:9000"
    networks:
      reliability:
        aliases: [minio]

  reliability-minio-init:
    <<: *minio-init
    profiles: ["reliability"]
    depends_on:
      reliability-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: kk-studio-reliability
      MINIO_ROOT_PASSWORD: kk-studio-reliability-only
      MINIO_BUCKET: kk-studio-reliability
    networks:
      - reliability

  reliability-app:
    profiles: ["reliability"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    image: kk-studio-app:reliability
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      KK_STUDIO_DB_URL: jdbc:postgresql://postgres:5432/kk_studio_reliability
      KK_STUDIO_DB_USER: kk_studio
      KK_STUDIO_DB_PASSWORD: kk_studio
      KK_STUDIO_STORAGE_S3_ENDPOINT: http://minio:9000
      KK_STUDIO_STORAGE_S3_PUBLIC_ENDPOINT: http://127.0.0.1:${RELIABILITY_MINIO_PORT:-19002}
      KK_STUDIO_STORAGE_S3_REGION: us-east-1
      KK_STUDIO_STORAGE_S3_BUCKET: kk-studio-reliability
      KK_STUDIO_STORAGE_S3_ACCESS_KEY: kk-studio-reliability
      KK_STUDIO_STORAGE_S3_SECRET_KEY: kk-studio-reliability-only
      KK_STUDIO_EXIT_CONFIRMATION_DIRECTORY: /app/execution-exits
    ports:
      - "127.0.0.1:${RELIABILITY_APP_PORT:-18091}:8080"
    volumes:
      - execution-exits:/app/execution-exits
    depends_on:
      reliability-postgres:
        condition: service_healthy
      reliability-minio:
        condition: service_healthy
      reliability-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    networks:
      reliability:
        aliases: [app]
      app-ingress:

  workspace-init:
    profiles: ["reliability"]
    build:
      context: ../..
      dockerfile: deploy/reliability/daemon.Dockerfile
    image: kk-studio-daemon:reliability
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["chown 10001:10001 /workspace"]
    volumes:
      - daemon-workspace:/workspace
    networks:
      - reliability

  daemon:
    profiles: ["reliability"]
    build:
      context: ../..
      dockerfile: deploy/reliability/daemon.Dockerfile
    image: kk-studio-daemon:reliability
    init: true
    depends_on:
      reliability-app:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    environment:
      KK_STUDIO_DAEMON_REGISTRATION_TOKEN: ${RELIABILITY_REGISTRATION_TOKEN:-e2e-token-reliability}
      KK_STUDIO_DAEMON_STUDIO_URL: http://app:8080
      KK_STUDIO_DAEMON_NOTE: Isolated Docker reliability environment.
    volumes:
      - daemon-workspace:/workspace
    networks:
      - reliability

volumes:
  postgres-data:
  minio-data:
  execution-exits:
  daemon-workspace:

networks:
  canvas-test:
    driver: bridge
  reliability:
    internal: true
  app-ingress:
