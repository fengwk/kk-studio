name: kk-studio-canvas-test

# This stack is intentionally local-only:
# - host ports bind to 127.0.0.1;
# - services share a dedicated project network, isolated from other stacks;
# - all credentials below are fixed, disposable test values.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: canvas_test
      POSTGRES_USER: canvas_test
      POSTGRES_PASSWORD: canvas_test_only
    ports:
      - "127.0.0.1:${CANVAS_TEST_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas_test -d canvas_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - canvas-test

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: canvas-test
      MINIO_ROOT_PASSWORD: canvas-test-only
    ports:
      - "127.0.0.1:${CANVAS_TEST_MINIO_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data
    networks:
      - canvas-test

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: canvas-test
      MINIO_ROOT_PASSWORD: canvas-test-only
      MINIO_BUCKET: canvas-test
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        mc stat "local/$${MINIO_BUCKET}"
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "mc stat \"local/$${MINIO_BUCKET}\" >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - canvas-test

  http-mock:
    image: python:3.12-alpine
    init: true
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      [
        "python",
        "/mock/server.py",
        "--routes",
        "/config/routes.json",
        "--opencli-fake-fixtures",
        "/fixtures"
      ]
    ports:
      - "127.0.0.1:${CANVAS_TEST_MOCK_PORT:-18089}:8080"
    volumes:
      - ./mock/server.py:/mock/server.py:ro
      - ${CANVAS_TEST_MOCK_ROUTES:-./mock/routes.json}:/config/routes.json:ro
      - ../../platform/src/test/resources/fun/fengwk/kkstudio/platform/canvas/resource:/fixtures:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      canvas-test:
        aliases:
          - stub.local
          - opencli-hub
          - comfyui

  app:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    image: ${CANVAS_TEST_APP_IMAGE:-kk-studio-app:canvas-test}
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev,canvas-test
      KK_STUDIO_DB_URL: jdbc:postgresql://postgres:5432/canvas_test
      KK_STUDIO_DB_USER: canvas_test
      KK_STUDIO_DB_PASSWORD: canvas_test_only
      KK_STUDIO_STORAGE_S3_ENDPOINT: http://minio:9000
      KK_STUDIO_STORAGE_S3_PUBLIC_ENDPOINT: http://127.0.0.1:${CANVAS_TEST_MINIO_PORT:-19000}
      KK_STUDIO_STORAGE_S3_REGION: us-east-1
      KK_STUDIO_STORAGE_S3_BUCKET: canvas-test
      KK_STUDIO_STORAGE_S3_ACCESS_KEY: canvas-test
      KK_STUDIO_STORAGE_S3_SECRET_KEY: canvas-test-only
      KK_STUDIO_CANVAS_RESOURCE_FFPROBE_BINARY: ffprobe
      KK_STUDIO_CANVAS_RESOURCE_FFMPEG_BINARY: ffmpeg
      KK_STUDIO_CANVAS_RESOURCE_TEMP_DIR: /tmp
      KK_STUDIO_CANVAS_FUNCTION_FAKE_ENABLED: "true"
    ports:
      - "127.0.0.1:${CANVAS_TEST_APP_PORT:-18088}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_healthy
      http-mock:
        condition: service_healthy
    networks:
      - canvas-test

volumes:
  postgres-data:
  minio-data:

networks:
  canvas-test:
    driver: bridge
