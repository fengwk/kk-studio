name: kk-studio-reliability

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kk_studio_reliability
      POSTGRES_USER: kk_studio
      POSTGRES_PASSWORD: kk_studio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kk_studio -d kk_studio_reliability"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - reliability

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kk-studio-reliability
      MINIO_ROOT_PASSWORD: kk-studio-reliability-only
    ports:
      - "127.0.0.1:${RELIABILITY_MINIO_PORT:-19002}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data
    networks:
      - reliability

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: kk-studio-reliability
      MINIO_ROOT_PASSWORD: kk-studio-reliability-only
      MINIO_BUCKET: kk-studio-reliability
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        mc stat "local/$${MINIO_BUCKET}"
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "mc stat \"local/$${MINIO_BUCKET}\" >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - reliability

  app:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    image: kk-studio-app:reliability
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      KK_STUDIO_DB_URL: jdbc:postgresql://postgres:5432/kk_studio_reliability
      KK_STUDIO_DB_USER: kk_studio
      KK_STUDIO_DB_PASSWORD: kk_studio
      KK_STUDIO_STORAGE_S3_ENDPOINT: http://minio:9000
      KK_STUDIO_STORAGE_S3_PUBLIC_ENDPOINT: http://127.0.0.1:${RELIABILITY_MINIO_PORT:-19002}
      KK_STUDIO_STORAGE_S3_REGION: us-east-1
      KK_STUDIO_STORAGE_S3_BUCKET: kk-studio-reliability
      KK_STUDIO_STORAGE_S3_ACCESS_KEY: kk-studio-reliability
      KK_STUDIO_STORAGE_S3_SECRET_KEY: kk-studio-reliability-only
    ports:
      - "127.0.0.1:${RELIABILITY_APP_PORT:-18091}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    networks:
      - reliability
      - app-ingress

  workspace-init:
    build:
      context: ../..
      dockerfile: deploy/reliability/daemon.Dockerfile
    image: kk-studio-daemon:reliability
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["chown 10001:10001 /workspace"]
    volumes:
      - daemon-workspace:/workspace
    networks:
      - reliability

  daemon:
    build:
      context: ../..
      dockerfile: deploy/reliability/daemon.Dockerfile
    image: kk-studio-daemon:reliability
    init: true
    depends_on:
      app:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    environment:
      KK_STUDIO_DAEMON_REGISTRATION_TOKEN: ${RELIABILITY_REGISTRATION_TOKEN:-e2e-token-reliability}
    command:
      - --gateway-uri
      - ws://app:8080/api/harness/environment-daemon/v1
      - --note
      - Isolated Docker reliability environment.
      - --environment-root
      - /workspace
      - --data-dir
      - /workspace/.kkstudio/daemon
    volumes:
      - daemon-workspace:/workspace
    networks:
      - reliability

networks:
  reliability:
    internal: true
  app-ingress:

volumes:
  postgres-data:
  minio-data:
  daemon-workspace:
