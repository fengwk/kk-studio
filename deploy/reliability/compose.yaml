name: kk-studio-reliability

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kk_studio_reliability
      POSTGRES_USER: kk_studio
      POSTGRES_PASSWORD: kk_studio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kk_studio -d kk_studio_reliability"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - reliability

  minio:
    # Verified community fork; source/revision and platform: ../dependencies/minio-client/README.md.
    image: fengwk/minio@sha256:ea0a48a13c701cf2c4397b3a9c0fe9e10ed65b2f58f056bf07e2ce7308123535
    platform: linux/amd64
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kk-studio-reliability
      MINIO_ROOT_PASSWORD: kk-studio-reliability-only
    ports:
      - "127.0.0.1:${RELIABILITY_MINIO_PORT:-19002}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data
    networks:
      - reliability

  # 一次性 bucket 初始化：创建私有 bucket 后成功退出。没有 healthcheck；app 用
  # `service_completed_successfully` 等待它，也只有该条件能让 `up --wait` 接受已退出容器。
  minio-init:
    build:
      context: ../dependencies/minio-client
    image: kk-studio-minio-client:RELEASE.2025-04-16T18-13-26Z
    pull_policy: build
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: kk-studio-reliability
      MINIO_ROOT_PASSWORD: kk-studio-reliability-only
      MINIO_BUCKET: kk-studio-reliability
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        mc stat "local/$${MINIO_BUCKET}"
    networks:
      - reliability

  app:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    image: kk-studio-app:reliability
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      KK_STUDIO_DB_URL: jdbc:postgresql://postgres:5432/kk_studio_reliability
      KK_STUDIO_DB_USER: kk_studio
      KK_STUDIO_DB_PASSWORD: kk_studio
      KK_STUDIO_STORAGE_S3_ENDPOINT: http://minio:9000
      KK_STUDIO_STORAGE_S3_PUBLIC_ENDPOINT: http://127.0.0.1:${RELIABILITY_MINIO_PORT:-19002}
      KK_STUDIO_STORAGE_S3_REGION: us-east-1
      KK_STUDIO_STORAGE_S3_BUCKET: kk-studio-reliability
      KK_STUDIO_STORAGE_S3_ACCESS_KEY: kk-studio-reliability
      KK_STUDIO_STORAGE_S3_SECRET_KEY: kk-studio-reliability-only
    ports:
      - "127.0.0.1:${RELIABILITY_APP_PORT:-18091}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    networks:
      - reliability
      - app-ingress

  workspace-init:
    build:
      context: ../..
      dockerfile: deploy/reliability/daemon.Dockerfile
    image: kk-studio-daemon:reliability
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["chown 10001:10001 /workspace"]
    volumes:
      - daemon-workspace:/workspace
    networks:
      - reliability

  daemon:
    build:
      context: ../..
      dockerfile: deploy/reliability/daemon.Dockerfile
    image: kk-studio-daemon:reliability
    init: true
    depends_on:
      app:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    environment:
      KK_STUDIO_DAEMON_REGISTRATION_TOKEN: ${RELIABILITY_REGISTRATION_TOKEN:-e2e-token-reliability}
      # 非机密安装配置：入口据此物化共享 daemon.json，daemon 只接收 --config。
      KK_STUDIO_DAEMON_STUDIO_URL: http://app:8080
      KK_STUDIO_DAEMON_NOTE: Isolated Docker reliability environment.
    volumes:
      - daemon-workspace:/workspace
    networks:
      - reliability

networks:
  reliability:
    internal: true
  app-ingress:

volumes:
  postgres-data:
  minio-data:
  daemon-workspace:
