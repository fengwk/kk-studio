<div class="ui-shell"><header class="ui-bar" id="ui-bar"></header><main class="ui-stage" id="main"><div class="ui-frame" id="ui-frame">
<!-- htmlview:content -->
<!-- workspace:styles -->
<section class="screen" id="scr-work" data-title="对话工作区">
  <div class="x-app" id="x-app" data-note="离线评审：对话、审批、画布和定时任务只操作样例，不调用模型、不执行命令、不连接环境。评审工具栏可模拟不同设备。">
    <span id="x-pending-description" hidden>有待处理事项</span>
    <div class="x-rail" id="x-rail" hidden>
      <span id="x-rail-brand"></span>
      <button type="button" class="x-ib" data-control="iconCompact" data-action="side-expand" aria-label="展开侧边栏" title="展开侧边栏"><span class="x-ic-slot" data-ic="sideR"></span></button>
      <div id="x-rail-footer" class="x-side-footer"></div>
    </div>
    <aside class="x-side" id="x-side" aria-label="侧边栏" data-note="只能删除空目录，并且至少保留一个顶层目录；正在运行、等待或需要处理的 Thread 不能删除。修改定时任务目标后，才能删除原目标。">
      <div class="x-side-head">
        <span id="x-side-brand"></span>
        <button type="button" class="x-chat-btn" data-action="chat-space-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="x-menu"><span class="x-chat-name" id="x-chat-space-name" data-allow-truncate>KK 开发</span><span class="x-ic-slot" data-ic="chevDown"></span></button>
        <button type="button" class="x-ib x-hide-narrow" data-control="iconCompact" data-action="side-collapse" aria-label="收起侧边栏" title="收起侧边栏"><span class="x-ic-slot" data-ic="sideL"></span></button>
        <button type="button" class="x-ib x-only-narrow" data-control="iconCompact" data-action="drawer-close" aria-label="收起侧边栏" title="收起侧边栏"><span class="x-ic-slot" data-ic="sideL"></span></button>
      </div>
      <div class="tabs x-views" aria-label="侧边栏视图" data-note="目录组织会话和画布；状态按运行状态找 Thread；定时管理当前 Chat Space 的定时任务。">
        <button type="button" data-tab="x-view-tree" aria-selected="true"><span>目录</span></button>
        <button type="button" data-tab="x-view-threads"><span>状态</span></button>
        <button type="button" data-tab="x-view-sched"><span>定时</span></button>
      </div>
      <div class="x-view" id="x-view-tree">
        <div class="x-tools">
          <label class="search x-search"><span class="x-ic-slot" data-ic="search"></span><input type="search" id="x-filter-tree" placeholder="筛选" aria-label="筛选目录、会话、画布和 Thread" autocomplete="off"></label>
          <button type="button" data-control="icon" data-action="new-root-folder" aria-label="新建顶层目录" title="新建顶层目录"><span class="x-ic-slot" data-ic="plus"></span></button>
        </div>
        <div class="x-list" id="x-tree" role="tree" aria-label="资源目录" data-note="筛选右侧的加号新建顶层目录。目录的更多菜单新建会话、画布或子目录。同一目录的会话和画布可以混排。拖拽即可排序或移动；触屏先按住再拖，直接滑动仍是滚动。Thread 按创建顺序排列，新分支追加在末尾。在目录视图中，状态变化只改变图标，不改变行的位置。"></div>
      </div>
      <div class="x-view" id="x-view-threads" hidden>
        <div class="x-tools">
          <label class="search x-search"><span class="x-ic-slot" data-ic="search"></span><input type="search" id="x-filter-threads" placeholder="筛选" aria-label="筛选 Thread" autocomplete="off"></label>
        </div>
        <div class="x-list" id="x-threads" data-note="需要你汇总本人各空间的待处理 Thread；其它状态只看当前空间。"></div>
      </div>
      <div class="x-view" id="x-view-sched" hidden>
        <div class="x-tools">
          <button type="button" class="x-new" data-control="ghostCompact" data-action="new-schedule"><span class="x-ic-slot" data-ic="plus"></span>新建定时任务</button>
        </div>
        <div class="x-list" id="x-sched" data-note="原型用「立即运行」演示，不会后台执行。执行记录一次展开一个任务，每页五条；有 Thread 的记录和目录资源用同一套窗格打开流程。"></div>
      </div>
      <div id="x-environments" class="x-environments"></div>
      <div id="x-side-footer" class="x-side-footer"></div>
      <div class="x-side-resize" id="x-side-resize" role="separator" aria-orientation="vertical" aria-label="调整侧边栏宽度" tabindex="0"></div>
    </aside>
    <div class="x-scrim" id="x-scrim" data-action="drawer-close" hidden></div>
    <div class="x-main" id="x-main" role="region" aria-label="窗格区">
      <div class="x-mobile-head x-only-narrow">
        <button type="button" data-control="icon" data-action="drawer-open" aria-label="打开侧边栏"><span class="x-ic-slot" data-ic="menu"></span></button>
        <div id="x-mobile-view" tabindex="-1"></div>
      </div>
      <div class="x-panes" id="x-panes" data-note="拆分后可直接输入，首条消息才创建会话。当前窗格为空时直接打开。已有内容时，点窗格中央的按钮选择位置，也可按 Enter 或字母，Esc 取消。多窗格用 A–H 标识；桌面可拖字母换位，窄屏点标题切换。全屏后可用标题栏或 Esc 恢复原布局。"></div>
      <div id="x-pane-storage" hidden></div>
      <div id="x-workspace-host" hidden></div>
    </div>
    <div class="x-menu" id="x-menu" role="menu" hidden></div>
  </div>

  <dialog class="dialog" id="dlg-msg" aria-labelledby="dlg-msg-title">
    <h3 id="dlg-msg-title">确认</h3>
    <div class="x-dlg-body" id="dlg-msg-body"></div>
    <div class="row">
      <button type="button" data-control="ghost" data-close id="dlg-msg-cancel">取消</button>
      <button type="button" data-control="danger" data-action="dlg-ok" id="dlg-msg-ok">删除</button>
    </div>
  </dialog>

  <dialog class="dialog" id="dlg-name" aria-labelledby="dlg-name-title">
    <h3 id="dlg-name-title">名称</h3>
    <form id="name-form" class="stack">
      <div class="field">
        <label id="name-label" for="name-value">名称</label>
        <input type="text" id="name-value" required maxlength="80" autocomplete="off" autofocus>
      </div>
      <div class="row">
        <button type="button" data-control="ghost" data-close>取消</button>
        <button type="submit" data-control="primary" id="name-submit">创建</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="dlg-canvas" aria-labelledby="dlg-canvas-title">
    <h3 id="dlg-canvas-title">新建画布</h3>
    <form id="canvas-form" class="stack">
      <div class="field">
        <label for="canvas-name">画布名称</label>
        <input type="text" id="canvas-name" required maxlength="80" autocomplete="off" autofocus>
      </div>
      <div class="row">
        <button type="button" data-control="ghost" data-close>取消</button>
        <button type="submit" data-control="primary">创建画布</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog x-dlg-wide" id="dlg-sched" aria-labelledby="dlg-sched-title">
    <h3 id="dlg-sched-title">新建定时任务</h3>
    <form class="x-sched-form" id="sch-form" novalidate>
      <div class="stack x-sched-fields">
      <div class="field">
        <label for="sch-name">名称</label>
        <input type="text" id="sch-name" required maxlength="40" autocomplete="off">
        <p class="field-error">请填写名称。</p>
      </div>
      <fieldset class="x-fieldset">
        <legend class="x-legend">到点做什么</legend>
        <div class="x-radios">
          <label class="radio"><input type="radio" name="sch-act" value="new" checked>新建会话</label>
          <label class="radio"><input type="radio" name="sch-act" value="branch">从某一轮分支</label>
          <label class="radio"><input type="radio" name="sch-act" value="continue">继续 Thread</label>
        </div>
      </fieldset>
      <div class="x-grid2" data-for="new">
        <div class="field">
          <label for="sch-folder">建在目录</label>
          <select id="sch-folder" required></select>
        </div>
        <div class="field">
          <label for="sch-agent">Agent</label>
          <select id="sch-agent" required><option>编码助手</option><option>调研助手</option><option>写作助手</option></select>
        </div>
      </div>
      <div class="x-grid2" data-for="branch" hidden>
        <div class="field">
          <label for="sch-session">会话</label>
          <select id="sch-session" required></select>
          <p class="field-error">还没有可选的会话。</p>
        </div>
        <div class="field">
          <label for="sch-turn">从哪一轮之后</label>
          <select id="sch-turn" required></select>
          <p class="field-error">还没有可选的位置。</p>
        </div>
      </div>
      <div class="field" data-for="continue" hidden>
        <div class="x-sched-label"><label for="sch-thread">Thread</label><span id="sch-thread-help"></span></div>
        <select id="sch-thread" required></select>
        <p class="field-error">还没有可选的 Thread。</p>
      </div>
      <div class="field">
        <label for="sch-prompt">发送的消息</label>
        <textarea id="sch-prompt" required rows="3" placeholder="例如：汇总过去 24 小时的 CI 结果，列出失败项和可能原因。"></textarea>
        <p class="field-error">请填写要发送的消息。</p>
      </div>
      <fieldset class="x-fieldset">
        <legend class="x-legend">什么时候运行</legend>
        <div class="seg" role="group" aria-label="运行方式">
          <button type="button" aria-pressed="true" data-action="sch-kind" data-kind="repeat">重复</button>
          <button type="button" aria-pressed="false" data-action="sch-kind" data-kind="once">一次</button>
        </div>
        <div class="x-grid2" data-kind-for="repeat">
          <div class="field">
            <label for="sch-freq">频率</label>
            <select id="sch-freq"><option value="daily">每天</option><option value="weekdays">工作日（周一至周五）</option><option value="weekly">每周</option><option value="hourly">每小时</option><option value="cron">自定义 cron</option></select>
          </div>
          <div class="field" data-freq-for="weekly">
            <label for="sch-dow">星期</label>
            <select id="sch-dow"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="0">周日</option></select>
          </div>
          <div class="field" data-freq-for="daily weekdays weekly">
            <label for="sch-time-picker">时间</label>
            <input type="time" id="sch-time" class="x-sched-native" aria-label="时间" required value="09:00">
            <div id="sch-time-control"></div>
            <p class="field-error">请选择时间。</p>
          </div>
          <div class="field" data-freq-for="hourly">
            <label for="sch-minute">每小时的第几分钟</label>
            <input type="number" id="sch-minute" required min="0" max="59" value="0">
            <p class="field-error">请填 0–59。</p>
          </div>
          <div class="field x-span2" data-freq-for="cron">
            <div class="x-sched-label"><label for="sch-cron">cron 表达式</label><span id="sch-cron-help"></span></div>
            <input type="text" id="sch-cron" required placeholder="0 9 * * 1-5" spellcheck="false" autocomplete="off">
            <p class="field-error">请填写 cron 表达式。</p>
          </div>
        </div>
        <div class="x-grid2" data-kind-for="once" hidden>
          <div class="field">
            <label for="sch-date-picker">日期</label>
            <input type="date" id="sch-date" class="x-sched-native" aria-label="日期" required>
            <div id="sch-date-control"></div>
            <p class="field-error">请选择日期。</p>
          </div>
          <div class="field">
            <label for="sch-once-time-picker">时间</label>
            <input type="time" id="sch-once-time" class="x-sched-native" aria-label="时间" required value="09:00">
            <div id="sch-once-time-control"></div>
            <p class="field-error">请选择时间。</p>
          </div>
        </div>
        <div class="field">
          <label for="sch-tz">时区</label>
          <select id="sch-tz" required></select>
        </div>
        <p class="x-preview" id="sch-preview" aria-live="polite"></p>
      </fieldset>
      </div>
      <div class="x-sched-actions">
        <button type="button" class="x-sched-delete" data-control="ghostDanger" data-action="sch-delete" id="sch-delete" hidden>删除任务</button>
        <button type="button" data-control="ghost" data-close>取消</button>
        <button type="submit" data-control="primary">保存</button>
      </div>
    </form>
    <div id="x-schedule-controls" hidden></div>
  </dialog>


</section>
<section class="screen" id="scr-login" data-title="登录" hidden>
  <div id="x-login" data-note="原型中 kkstudio（管理员）和 chen（普通用户）可用任意密码登录。"></div>
</section>
<section class="screen" id="scr-provider" data-title="提供商 · 加载" hidden>
  <div class="x-extra-preview" id="x-provider-preview"></div>
</section>
<section class="screen" id="scr-settings" data-title="设置" hidden>
  <div class="x-extra-preview" id="x-settings-preview"></div>
</section>
<script type="module" src="./start.ts"></script>
<!-- /htmlview:content -->
</div><aside class="ui-notes" id="ui-notes" aria-label="标注"></aside></main></div>
</body>
</html>
