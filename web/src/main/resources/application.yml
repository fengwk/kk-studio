spring:

  application:
    # 应用名称
    name: kk-studio

  profiles:
    active: dev

  mvc:
    converters:
      # spring mvc使用的json转换器，使用规约指定的gson
      # jackson JacksonHttpMessageConvertersConfiguration
      # gson GsonHttpMessageConvertersConfiguration
      preferred-json-mapper: jackson

  # PostgreSQL 连接配置（唯一 durable 数据库）
  datasource:
    driver-class-name: org.postgresql.Driver
    # 替换为 PostgreSQL {host}、{port}、{database}
    url: jdbc:postgresql://{host}:{port}/{database}
    # 替换为 PostgreSQL {username}
    username: {username}
    # 替换为 PostgreSQL {password}
    password: {password}

server:
  port: 8080
  # Compression
  compression:
    # 启用gzip压缩
    enabled: true

# https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,offline,online"

# 日志配置
logging:
  level:
    root: info

# 规约配置
convention:
  i18n:
    # i18n properties文件名称
    base-name: string
    # 使用语言
    locale: en_US

  code:
    i18n:
      # 错误码i18n语言，与i18n.locale保持一致
      locale: ${convention.i18n.locale}

kk-studio:
  harness:
    environment-gateway:
      # Daemon WebSocket 单帧上限（字节）。协议安全边界，不进 SystemSettings。
      max-message-bytes: ${KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_MESSAGE_BYTES:16777216}
  canvas:
    function:
      minimax-h3:
        # 仅保留部署秘密；启用、路由与超时由 system_setting.integrations.minimaxH3 提供。
        comfy-bearer-token: ${KK_STUDIO_CANVAS_H3_COMFY_BEARER_TOKEN:}
