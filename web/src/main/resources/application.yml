spring:

  autoconfigure:
    exclude:
      - fun.fengwk.convention4j.springboot.starter.web.error.WebErrorAutoConfiguration

  application:
    # 应用名称
    name: kk-studio

  profiles:
    active: dev

  mvc:
    converters:
      # spring mvc使用的json转换器，使用规约指定的gson
      # jackson JacksonHttpMessageConvertersConfiguration
      # gson GsonHttpMessageConvertersConfiguration
      preferred-json-mapper: jackson

  # PostgreSQL 连接配置（唯一 durable 数据库）
  datasource:
    driver-class-name: org.postgresql.Driver
    # 替换为 PostgreSQL {host}、{port}、{database}
    url: jdbc:postgresql://{host}:{port}/{database}
    # 替换为 PostgreSQL {username}
    username: {username}
    # 替换为 PostgreSQL {password}
    password: {password}
    hikari:
      # 边界 1（连接池获取）：从连接池借出连接的最长等待（毫秒），低于默认 10s directory budget
      connection-timeout: 5000
      data-source-properties:
        # 边界 2（TCP connect）：PostgreSQL JDBC 建立物理 TCP 连接上限（秒），防止断网时持续等待
        connectTimeout: "5"
        # 边界 3（socket read）：PostgreSQL JDBC 底层 socket 读超时（秒），确保断网时阻塞的 SQL 在 5 秒内 fail-closed；
        # LISTEN 循环中 getNotifications(pollMillis) 会临时以 poll timeout 覆盖并恢复 SO_TIMEOUT，不破坏通知循环
        socketTimeout: "5"

mybatis:
  mapper-locations: classpath:**/*Mapper.xml
  type-aliases-package: fun.fengwk.kkstudio.**.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  # Compression
  compression:
    # 启用gzip压缩
    enabled: true

# https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,offline,online"

# 日志配置
logging:
  level:
    root: info

# 规约配置
convention:
  i18n:
    # i18n properties文件名称
    base-name: string
    # 使用语言
    locale: en_US

  code:
    i18n:
      # 错误码i18n语言，与i18n.locale保持一致
      locale: ${convention.i18n.locale}

kk-studio:
  storage:
    maintenance:
      # Durable storage cleanup worker deployment controls; not mutable SystemSettings.
      poll-delay: ${KK_STUDIO_STORAGE_MAINTENANCE_POLL_DELAY:30s}
      cleanup-lease: ${KK_STUDIO_STORAGE_MAINTENANCE_CLEANUP_LEASE:5m}
  harness:
    runtime:
      # 部署级开关；NAS Dev 通过环境变量关闭 dispatcher，只保留 API/query preview。
      workers-enabled: ${KK_STUDIO_HARNESS_RUNTIME_WORKERS_ENABLED:true}
    dispatcher:
      # 本地 queued/running Processor handoff 总量上限；不进入 SystemSettings/DTO/frontend。
      max-dispatch-tasks: ${KK_STUDIO_HARNESS_DISPATCHER_MAX_DISPATCH_TASKS:64}
      lease-duration: ${KK_STUDIO_HARNESS_DISPATCHER_LEASE_DURATION:30s}
      poll-interval: ${KK_STUDIO_HARNESS_DISPATCHER_POLL_INTERVAL:1s}
      rejection-delay: ${KK_STUDIO_HARNESS_DISPATCHER_REJECTION_DELAY:1s}
      worker:
        concurrency: ${KK_STUDIO_HARNESS_DISPATCHER_WORKER_CONCURRENCY:16}
        queue-capacity: ${KK_STUDIO_HARNESS_DISPATCHER_WORKER_QUEUE_CAPACITY:64}
    execution-admission:
      # 进程级执行容量；不进入 SystemSettings/DTO/frontend。
      model: ${KK_STUDIO_MODEL_MAX_CONCURRENCY:16}
      tool: ${KK_STUDIO_TOOL_MAX_CONCURRENCY:64}
      subagent: ${KK_STUDIO_SUBAGENT_MAX_CONCURRENCY:10}
    environment-gateway:
      # Daemon WebSocket 单帧上限（字节）。协议安全边界，不进 SystemSettings。
      max-message-bytes: ${KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_MESSAGE_BYTES:16777216}
      # 每连接出站待发送帧数与 UTF-8 总字节上限（均包含正在发送的帧）。
      queue-capacity: ${KK_STUDIO_ENVIRONMENT_GATEWAY_QUEUE_CAPACITY:256}
      max-bytes: ${KK_STUDIO_ENVIRONMENT_GATEWAY_MAX_BYTES:16777216}
      # 单帧发送超时；慢连接按传输失败关闭，不阻塞 Gateway。
      send-timeout: ${KK_STUDIO_ENVIRONMENT_GATEWAY_SEND_TIMEOUT:10s}
  canvas:
    function:
      runtime:
        worker-concurrency: ${KK_STUDIO_CANVAS_FUNCTION_WORKER_CONCURRENCY:2}
        max-dispatch-tasks: ${KK_STUDIO_CANVAS_FUNCTION_MAX_DISPATCH_TASKS:2}
        lease-duration-millis: ${KK_STUDIO_CANVAS_FUNCTION_LEASE_DURATION_MILLIS:30000}
        heartbeat-interval-millis: ${KK_STUDIO_CANVAS_FUNCTION_HEARTBEAT_INTERVAL_MILLIS:10000}
        poll-interval-millis: ${KK_STUDIO_CANVAS_FUNCTION_POLL_INTERVAL_MILLIS:1000}
        rejection-delay-millis: ${KK_STUDIO_CANVAS_FUNCTION_REJECTION_DELAY_MILLIS:1000}
      minimax-h3:
        # 仅保留部署秘密；启用、路由与超时由 system_setting.integrations.minimaxH3 提供。
        comfy-bearer-token: ${KK_STUDIO_CANVAS_H3_COMFY_BEARER_TOKEN:}
  plugins:
    # owner-only 绝对路径、32 bytes 原始 AES-256 主密钥、多节点必须一致、不进数据库/DTO/日志、留空表示本部署不提供凭据能力且读写 fail closed
    credential-key-file: ${KK_STUDIO_PLUGINS_CREDENTIAL_KEY_FILE:}
    refresh:
      poll-delay: ${KK_STUDIO_PLUGINS_REFRESH_POLL_DELAY:1h}
      lease-duration: ${KK_STUDIO_PLUGINS_REFRESH_LEASE_DURATION:2m}
