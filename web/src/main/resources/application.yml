spring:

  application:
    # 应用名称
    name: kk-studio

  profiles:
    active: dev

  mvc:
    converters:
      # spring mvc使用的json转换器，使用规约指定的gson
      # jackson JacksonHttpMessageConvertersConfiguration
      # gson GsonHttpMessageConvertersConfiguration
      preferred-json-mapper: jackson

  data:
    redis:
      # Redis 仅用于 harness realtime projection；可用环境变量覆盖。
      url: ${KK_STUDIO_REDIS_URL:redis://localhost:6379}

  # PostgreSQL 连接配置（唯一 durable 数据库）
  datasource:
    driver-class-name: org.postgresql.Driver
    # 替换为 PostgreSQL {host}、{port}、{database}
    url: jdbc:postgresql://{host}:{port}/{database}
    # 替换为 PostgreSQL {username}
    username: {username}
    # 替换为 PostgreSQL {password}
    password: {password}

server:
  port: 8080
  # Compression
  compression:
    # 启用gzip压缩
    enabled: true

# https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,offline,online"

# 日志配置
logging:
  level:
    root: info

# 规约配置
convention:
  i18n:
    # i18n properties文件名称
    base-name: string
    # 使用语言
    locale: en_US

  code:
    i18n:
      # 错误码i18n语言，与i18n.locale保持一致
      locale: ${convention.i18n.locale}

kk-studio:
  canvas:
    function:
      minimax-h3:
        enabled: ${KK_STUDIO_CANVAS_H3_ENABLED:false}
        prompt-agent-name: ${KK_STUDIO_CANVAS_H3_PROMPT_AGENT:}
        prompt-environment-name: ${KK_STUDIO_CANVAS_H3_PROMPT_ENVIRONMENT:}
        presign-expiry-seconds: ${KK_STUDIO_CANVAS_H3_PRESIGN_EXPIRY_SECONDS:600}
        prompt-max-wait: ${KK_STUDIO_CANVAS_H3_PROMPT_MAX_WAIT:10m}
        comfy-base-url: ${KK_STUDIO_CANVAS_H3_COMFY_BASE_URL:}
        comfy-bearer-token: ${KK_STUDIO_CANVAS_H3_COMFY_BEARER_TOKEN:}
        comfy-connect-timeout: ${KK_STUDIO_CANVAS_H3_COMFY_CONNECT_TIMEOUT:10s}
        comfy-request-timeout: ${KK_STUDIO_CANVAS_H3_COMFY_REQUEST_TIMEOUT:30s}
        comfy-poll-interval: ${KK_STUDIO_CANVAS_H3_COMFY_POLL_INTERVAL:2s}
        comfy-max-wait: ${KK_STUDIO_CANVAS_H3_COMFY_MAX_WAIT:30m}
