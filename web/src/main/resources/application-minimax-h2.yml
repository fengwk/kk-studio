spring:

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema-h2.sql
      data-locations:
        - classpath:data-minimax-h2.sql

  datasource:
    multi:
      primary:
        primary: true
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:kk-studio-minimax-h2;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
        username: SA

  h2:
    console:
      enabled: true
      path: /h2-console

  mybatis:
    mapper-locations: classpath:**/*Mapper.xml
    type-aliases-package: fun.fengwk.kkstudio.**.model
    configuration:
      map-underscore-to-camel-case: true

  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

convention:
  snowflake-id:
    initial-timestamp: 1702214261706
    worker-id: 0

kk-studio:
  agent:
    runtime:
      providers:
        minimax:
          provider-type: openai
          base-url: ${MINIMAX_BASE_URL:https://api.minimax.io/v1}
          api-key: ${MINIMAX_API_KEY}
          timeout: 120s
          stream-idle-timeout: 120s

logging:
  level:
    root: info
