spring:

  flyway:
    locations: classpath:db/migration,classpath:db/seed/dev
    validate-migration-naming: true

  datasource:
    driver-class-name: org.postgresql.Driver
    # 本地/开发默认指向 PostgreSQL；可被环境变量覆盖
    url: ${KK_STUDIO_DB_URL:jdbc:postgresql://127.0.0.1:5432/kk_studio}
    username: ${KK_STUDIO_DB_USER:kk_studio}
    password: ${KK_STUDIO_DB_PASSWORD:kk_studio}

mybatis:
  mapper-locations: classpath:**/*Mapper.xml
  type-aliases-package: fun.fengwk.kkstudio.**.model
  configuration:
    map-underscore-to-camel-case: true


logging:
  level:
    root: info
