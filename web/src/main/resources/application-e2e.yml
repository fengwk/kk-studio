spring:

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema-postgresql.sql
      data-locations:
        - classpath:data-e2e-postgresql.sql

  datasource:
    multi:
      primary:
        primary: true
        driver-class-name: org.postgresql.Driver
        url: ${KK_STUDIO_DB_URL:jdbc:postgresql://127.0.0.1:5432/kk_studio_e2e}
        username: ${KK_STUDIO_DB_USER:kk_studio}
        password: ${KK_STUDIO_DB_PASSWORD:kk_studio}

  mybatis:
    mapper-locations: classpath:**/*Mapper.xml
    type-aliases-package: fun.fengwk.kkstudio.**.model
    configuration:
      map-underscore-to-camel-case: true

convention:
  snowflake-id:
    initial-timestamp: 1702214261706
    worker-id: 0

kk-studio:
  harness:
    environment-gateway:
      daemon-token: e2e-daemon-token
      max-artifact-bytes: 8388608
      max-message-bytes: 16777216

logging:
  level:
    root: info
