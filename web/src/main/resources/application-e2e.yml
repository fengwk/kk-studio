spring:

  flyway:
    locations: classpath:db/migration,classpath:db/seed/e2e
    validate-migration-naming: true

  datasource:
    multi:
      primary:
        primary: true
        driver-class-name: org.postgresql.Driver
        url: ${KK_STUDIO_DB_URL:jdbc:postgresql://127.0.0.1:5432/kk_studio_e2e}
        username: ${KK_STUDIO_DB_USER:kk_studio}
        password: ${KK_STUDIO_DB_PASSWORD:kk_studio}

  mybatis:
    mapper-locations: classpath:**/*Mapper.xml
    type-aliases-package: fun.fengwk.kkstudio.**.model
    configuration:
      map-underscore-to-camel-case: true


kk-studio:
  tool:
    # L4 tool.read_turn 固定验证非 YOLO approval；生产 profile 仍使用部署级 permission 配置。
    settings-json: >-
      {"permission":{"read":"ask"},"defaultYolo":false}
  harness:
    environment-gateway:
      daemon-token: e2e-daemon-token
      max-resource-bytes: 8388608
      max-message-bytes: 16777216

logging:
  level:
    root: info
