spring:

  application:
    name: kk-studio

  flyway:
    enabled: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:1/unused
    username: unused
    password: unused
    # 多个缓存 Spring TestContext 共享同一 Testcontainers PostgreSQL；禁止每个上下文预热 10 个连接。
    hikari:
      minimum-idle: 0
      maximum-pool-size: 4

kk-studio:
  storage:
    s3:
      endpoint: http://minio.test-local:9000
      public-endpoint: https://cdn.test-local
      region: auto
      bucket: test-bucket
      access-key: test-access-key
      secret-key: test-secret-key
  harness:
    runtime:
      workers-enabled: false
      # 每个测试上下文使用独立目录，避免文件锁在并行/缓存上下文间冲突。
      exit-confirmation-directory: ${java.io.tmpdir}/kk-studio-exit-confirmation-${random.uuid}

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C
    baggage:
      enabled: false
    export:
      otlp:
        enabled: false
