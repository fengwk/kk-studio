spring:

  application:
    name: kk-studio

  sql:
    init:
      mode: never

  datasource:
    multi:
      primary:
        primary: true
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://127.0.0.1:1/unused
        username: unused
        password: unused

  mybatis:
    mapper-locations: classpath:**/*Mapper.xml
    type-aliases-package: fun.fengwk.kkstudio.**.model
    configuration:
      map-underscore-to-camel-case: true

convention:
  snowflake-id:
    initial-timestamp: 1702214261706
    worker-id: 0

kk-studio:
  harness:
    runtime:
      workers-enabled: false
    environment-gateway:
      daemon-token: test-daemon-token
