spring:

  application:
    name: kk-studio

  sql:
    init:
      schema-locations:
        - classpath:schema-h2.sql
      data-locations:
        - classpath:data-dev.sql

  datasource:
    multi:
      primary:
        primary: true
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
        username: SA

  mybatis:
    mapper-locations: classpath:**/*Mapper.xml
    type-aliases-package: fun.fengwk.kkstudio.**.model
    configuration:
      map-underscore-to-camel-case: true

convention:
  snowflake-id:
    initial-timestamp: 1702214261706
    worker-id: 0

kk-studio:
  harness:
    runtime:
      workers-enabled: false
    environment-gateway:
      daemon-token: test-daemon-token
