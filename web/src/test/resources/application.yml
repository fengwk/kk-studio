spring:

  application:
    name: kk-studio

  flyway:
    enabled: false

  datasource:
    multi:
      primary:
        primary: true
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://127.0.0.1:1/unused
        username: unused
        password: unused

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  mybatis:
    mapper-locations: classpath:**/*Mapper.xml
    type-aliases-package: fun.fengwk.kkstudio.**.model
    configuration:
      map-underscore-to-camel-case: true


kk-studio:
  harness:
    runtime:
      workers-enabled: false
      environment-root: target/harness-environment
    environment-gateway:
      daemon-token: test-daemon-token
