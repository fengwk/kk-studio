spring:

  autoconfigure:
    exclude:
      - fun.fengwk.convention4j.springboot.starter.web.error.WebErrorAutoConfiguration

  application:
    name: kk-studio

  flyway:
    enabled: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:1/unused
    username: unused
    password: unused
    # 多个缓存 Spring TestContext 共享同一 Testcontainers PostgreSQL；禁止每个上下文预热 10 个连接。
    hikari:
      minimum-idle: 0
      maximum-pool-size: 4

mybatis:
  mapper-locations: classpath:**/*Mapper.xml
  type-aliases-package: fun.fengwk.kkstudio.**.model
  configuration:
    map-underscore-to-camel-case: true


kk-studio:
  storage:
    s3:
      endpoint: http://minio.test-local:9000
      public-endpoint: https://cdn.test-local
      region: auto
      bucket: test-bucket
      access-key: test-access-key
      secret-key: test-secret-key
  harness:
    runtime:
      workers-enabled: false
      resource-root: target/harness-resources
