name: daemon-go-ci

on:
  push:
    paths:
      - 'daemon-go/**'
      - '.github/workflows/daemon-go-ci.yml'
  pull_request:
    paths:
      - 'daemon-go/**'
      - '.github/workflows/daemon-go-ci.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon-go/go.mod
      - name: Install protoc and generator
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip
          sudo unzip -oq /tmp/protoc.zip -d /usr
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify generated protocol
        run: daemon-go/scripts/check-generated.sh
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find daemon-go -name '*.go'))"
      - name: Vet
        working-directory: daemon-go
        run: go vet ./...
      - name: Staticcheck
        working-directory: daemon-go
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Version alignment
        run: node scripts/dev/verify/repository/check-version-alignment.mjs
      - name: Cross-compile six targets
        working-directory: daemon-go
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /tmp/kk-studio-daemon-${target%/*}-${target#*/} ./cmd/kk-studio-daemon
          done

  jetty-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon-go/go.mod
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Go daemon
        working-directory: daemon-go
        env:
          CGO_ENABLED: '0'
        run: go build -o "$RUNNER_TEMP/kk-studio-daemon-go" ./cmd/kk-studio-daemon
      - name: Verify RFC 8441 interoperability with Jetty
        env:
          MAVEN_OPTS: -Xmx2g
          DAEMON_BINARY: ${{ runner.temp }}/kk-studio-daemon-go
        run: |
          mvn -B -ntp -q -pl web -am test \
            -Dtest=DaemonCrossLanguageIntegrationTest#dataPlaneRoutingHttpAndExtendedConnectReturn404ForNonexistentView \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Ddaemon.bin="$DAEMON_BINARY"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon-go/go.mod
      - name: Test
        working-directory: daemon-go
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          test_json="$RUNNER_TEMP/go-test.json"
          if ! go test -json ./... > "$test_json"; then
            cat "$test_json"
            exit 1
          fi
          awk '
            /"Action":"(pass|skip)"/ && /"Test":/ {
              total++
              if ($0 ~ /"Package":"[^"]*\/internal\/native"/) {
                native++
              }
            }
            END {
              printf "test events (pass/skip, including subtests): total=%d, internal/native=%d\n", total, native
            }
          ' "$test_json"
      - name: Native coverage
        working-directory: daemon-go
        shell: bash
        run: |
          coverage_file="$RUNNER_TEMP/native-coverage.out"
          go test ./internal/native -coverprofile="$coverage_file"
          go tool cover -func="$coverage_file" | tee "$RUNNER_TEMP/native-coverage.txt"
          awk '/^total:/ { print "internal/native total coverage: " $3 }' "$RUNNER_TEMP/native-coverage.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-coverage-${{ matrix.os }}
          path: ${{ runner.temp }}/native-coverage.out
          if-no-files-found: error
      - name: Race test
        if: runner.os == 'Linux' || runner.os == 'macOS'
        working-directory: daemon-go
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  native-coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon-go/go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-coverage-*
          path: coverage
      - name: Merge native coverage profiles
        working-directory: daemon-go
        shell: bash
        run: |
          set -eu
          profile="$RUNNER_TEMP/native-coverage-merged.out"
          awk 'FNR == 1 { next } {
            if (!($1 in statements)) {
              order[++size] = $1
              statements[$1] = $2
            }
            if (!($1 in counts) || $3 > counts[$1]) {
              counts[$1] = $3
            }
          } END {
            print "mode: set"
            for (i = 1; i <= size; i++) {
              key = order[i]
              print key, statements[key], counts[key]
            }
          }' ../coverage/native-coverage-*/*.out > "$profile"
          go tool cover -func="$profile" | tee "$RUNNER_TEMP/native-coverage-merged.txt"
          awk '/^total:/ { print "merged internal/native coverage: " $3 }' "$RUNNER_TEMP/native-coverage-merged.txt"
