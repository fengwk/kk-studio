# kk-studio process scope platform matrix.
#
# OS 级执行范围（POSIX 会话 / Windows Job Object）只用一个平台验证不完：Linux 覆盖 POSIX
# 分支，macOS 覆盖同一套代码在另一种 POSIX 实现上的行为，Windows 覆盖 kernel32 的 Job 语义与
# 命令行拼装。终端基座同样纳入这个矩阵：单 owner JediTerm 内核、数值投影与按宿主 OS 解析的
# launch 规格必须在每条原生平台上真跑，Daemon 侧的单 owner 协调器状态机（单例会话、重绑、观察流
# credit、有界 mailbox 与 writer 围栏）也必须由每条腿的实跑而非一套 Linux 结论证明。矩阵只跑与执行
# 范围及终端基座直接相关的测试，全部是本机进程行为，不需要外部服务、凭证或模型（真模型/L1 API 回归
# 另见 `scripts/dev/verify/e2e/run.sh`）。
name: process-scope

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'harness/daemon/**'
      - 'harness/environment/**'
      - 'scripts/dev/verify/process-scope/**'
      - 'pom.xml'
      - '.github/workflows/process-scope.yml'
  pull_request:
    paths:
      - 'harness/daemon/**'
      - 'harness/environment/**'
      - 'scripts/dev/verify/process-scope/**'
      - 'pom.xml'
      - '.github/workflows/process-scope.yml'
  workflow_dispatch:

# 只读仓库内容：本工作流不发布任何产物，也不读取 secrets。
permissions:
  contents: read

concurrency:
  group: process-scope-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  scope_tests:
    name: process scope (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # ProcessScopeCrossPlatformTest 是三个平台上都必须真跑的核心验收：它用只依赖 JDK 的夹具造出真实进程层级，
      # 因此没有 assumeFalse 可以把它在这台 runner 上跳过。其余用例走平台的 shell 语义，所以每台 runner 跑的类不同：
      # 用裸名 bash 的遗留编码能力夹具只在 Linux/macOS 上跑（Windows 上裸名会命中 WSL 转发程序，见下面分支里的说明）。
      # helper 覆盖率开关在这台 runner 上打开：执行范围的核心逻辑一半在 helper 的独立 JVM 里，而它的平台分支只有在
      # 对应平台上才会被执行，三平台数据必须一起收集才能合并出有意义的数字。
      - name: Run process scope tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # Linux 跑完整 daemon 套件：执行范围的行为散布在 bash 能力与编码能力的边界用例里，只挑几个类会让覆盖率与真实
            # 覆盖面脱节（本机完整套件里 BashCapability 比 CI 的局部运行高约 5 个百分点）。
            env JAVA_HOME="$JAVA_HOME" mvn -B -ntp -pl harness/daemon -am test \
              -Dkk-studio.process-scope.helper-coverage=true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macOS 跑执行范围与终端基座相关的全部类：POSIX shell 语义由系统 bash 承担，编码能力的边界用例因此同样有证据；
            # 终端内核、数值投影与 launch 规格也在这里真跑。
            env JAVA_HOME="$JAVA_HOME" mvn -B -ntp -pl harness/daemon -am test \
              -Dtest='ProcessScopeCrossPlatformTest,ProcessScopeTest,ProcessScopeStateTest,ProcessScopeHelperFailureTest,ProcessScopePtyIntegrationTest,ProcessScopeInteractivePtyTest,ProcessScopeConPtyIntegrationTest,PosixProcessSessionTest,PosixProcessSignalOrderTest,BashCapabilityTest,CodingCapabilitiesTest,CodingCapabilitiesEdgeTest,WindowsCommandLineTest,WindowsJobScopeTest,TerminalKernelTest,TerminalKernelSchedulingTest,TerminalSnapshotProjectorTest,HeadlessTerminalDisplayTest,TerminalLaunchSpecTest,TerminalViewStreamTest,TerminalRuntimeDeterministicTest,TerminalRuntimeRealPtyTest,TerminalWriterTest,TerminalCoordinatorTest,DaemonRuntimeTest,DaemonRuntimeShellTest,DaemonTerminalServerIntegrationTest' \
              -Dkk-studio.process-scope.helper-coverage=true \
              -Dsurefire.failIfNoSpecifiedTests=false
          else
            # Windows runner 自带 Git Bash（本 workflow 的 shell: bash 用的就是它），但下面两个遗留编码能力夹具用**裸名**
            # bash 作为命令，按 CreateProcess 的搜索顺序只会命中 System32 的 WSL 转发程序，因此它们不属于 Windows 腿的
            # 执行范围：它们仍由 Linux 完整套件与 macOS 覆盖。执行范围自己的原生用例、以及显式定位 Git Bash 的
            # BashCapabilityTest 照常在 Windows 上验收（它按平台前置条件跳过的 12 条是它自己的既有约定，断言脚本另外点名
            # 要求其中两条在 Windows 上必须真跑）。终端内核、数值投影与 launch 规格同属本腿范围，也在此真跑。helper
            # 覆盖率同样打开：helper 的平台分支只有在对应平台上才会被执行。
            env JAVA_HOME="$JAVA_HOME" mvn -B -ntp -pl harness/daemon -am test \
              -Dtest='ProcessScopeCrossPlatformTest,ProcessScopeTest,ProcessScopeStateTest,ProcessScopeHelperFailureTest,ProcessScopePtyIntegrationTest,ProcessScopeInteractivePtyTest,ProcessScopeConPtyIntegrationTest,PosixProcessSessionTest,PosixProcessSignalOrderTest,BashCapabilityTest,WindowsCommandLineTest,WindowsJobScopeTest,TerminalKernelTest,TerminalKernelSchedulingTest,TerminalSnapshotProjectorTest,HeadlessTerminalDisplayTest,TerminalLaunchSpecTest,TerminalViewStreamTest,TerminalRuntimeDeterministicTest,TerminalRuntimeRealPtyTest,TerminalWriterTest,TerminalCoordinatorTest,DaemonRuntimeTest,DaemonRuntimeShellTest,DaemonTerminalServerIntegrationTest' \
              -Dkk-studio.process-scope.helper-coverage=true \
              -Dsurefire.failIfNoSpecifiedTests=false
          fi
      # 验收不允许被跳过、也不允许被漏跑：按用例名核对，数量断言会被新增用例弄陈旧。
      - name: Assert every selected case really ran
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          "$py" scripts/dev/verify/process-scope/assert-surefire-reports.py \
            harness/daemon/target/surefire-reports "${{ matrix.os }}"
      # 覆盖率输入必须每次都上传：任何一条平台的缺口都会让合并报告失真，而不是让门禁恰好通过。
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scope-coverage-${{ matrix.os }}
          path: |
            harness/daemon/target/jacoco.exec
            harness/daemon/target/jacoco-helper/
            harness/daemon/target/classes/
          if-no-files-found: error
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-${{ matrix.os }}
          path: harness/daemon/target/surefire-reports/
          if-no-files-found: ignore

  scope_coverage:
    name: merged scope coverage
    needs: scope_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Download the coverage data of every platform
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scope-coverage-*
          path: coverage/platforms
      # 三平台的类文件必须逐字节一致，否则 JaCoCo 会按 class id 静默丢掉 session；这里把它变成显式失败。
      - name: Collect exec files and verify the class files agree
        shell: bash
        run: python3 scripts/dev/verify/process-scope/collect-coverage-inputs.py coverage/platforms coverage/inputs
      - name: Fetch the JaCoCo CLI and the execution data reader
        shell: bash
        run: |
          set -euo pipefail
          # CLI 负责 merge/report；core 只作为规范化工具的官方 Reader，两者都固定 0.8.11 且只用于构建期，不进入项目依赖。
          env JAVA_HOME="$JAVA_HOME" mvn -B -ntp dependency:copy \
            -Dartifact=org.jacoco:org.jacoco.cli:0.8.11:jar:nodeps \
            -DoutputDirectory=coverage/tools
          env JAVA_HOME="$JAVA_HOME" mvn -B -ntp dependency:copy \
            -Dartifact=org.jacoco:org.jacoco.core:0.8.11:jar \
            -DoutputDirectory=coverage/tools
      # 规范化工具的正负测试必须真跑（不跳过）：直接在已取到 core 的环境里执行，确保它读的正是 CI 用的那份官方 Reader。
      # 该模块不匹配通用无参数 discover 的默认模式，因此不会被没准备 core 的其它 workflow 误跑。
      - name: Test the coverage normalization tool
        shell: bash
        env:
          JACOCO_CORE_JAR: coverage/tools/org.jacoco.core-0.8.11.jar
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s scripts/dev/verify/process-scope/tests -p normalize_coverage_test.py -v
      # 被终止的 helper 会留下一条未完成的执行数据记录；这里只裁掉那一条尾部残缺字节，其余输入逐字节保留，父 exec 与任何格式损坏都失败。
      - name: Normalize the exec inputs
        shell: bash
        run: |
          set -euo pipefail
          java -cp coverage/tools/org.jacoco.core-0.8.11.jar \
            scripts/dev/verify/process-scope/NormalizeCoverage.java \
            coverage/inputs/exec-files.txt coverage/normalized
      - name: Merge every platform and build the report
        shell: bash
        run: |
          set -euo pipefail
          cli=coverage/tools/org.jacoco.cli-0.8.11-nodeps.jar
          java -jar "$cli" merge $(cat coverage/normalized/exec-files.txt) --destfile coverage/merged.exec
          java -jar "$cli" report coverage/merged.exec \
            --classfiles coverage/inputs/classes \
            --sourcefiles harness/daemon/src/main/java \
            --xml coverage/coverage.xml
      # 父进程与 helper 的核心行覆盖门禁：数字只能来自三平台合并，单平台（尤其是本地 Linux）不构成结论。
      - name: Enforce the core line coverage gate
        shell: bash
        run: python3 scripts/dev/verify/process-scope/gate-core-coverage.py coverage/coverage.xml
