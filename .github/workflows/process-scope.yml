# kk-studio process scope platform matrix.
#
# OS 级执行范围（POSIX 进程组 / Windows Job Object）只用一个平台验证不完：Linux 覆盖 POSIX
# 分支，macOS 覆盖同一套代码在另一种 POSIX 实现上的行为，Windows 覆盖 kernel32 的 Job 语义与
# 命令行拼装。矩阵只跑与执行范围直接相关的测试，全部是本机进程行为，不需要外部服务、凭证或
# 模型（真模型/L1 API 回归另见 `scripts/dev/verify/e2e/run.sh`）。
name: process-scope

on:
  push:
    branches:
      - worktree/audit-process-scope
      - main
      - dev
    paths:
      - 'harness/daemon/**'
      - 'harness/environment/**'
      - 'pom.xml'
      - '.github/workflows/process-scope.yml'
  pull_request:
    paths:
      - 'harness/daemon/**'
      - 'harness/environment/**'
      - 'pom.xml'
      - '.github/workflows/process-scope.yml'
  workflow_dispatch:

# 只读仓库内容：本工作流不发布任何产物，也不读取 secrets。
permissions:
  contents: read

concurrency:
  group: process-scope-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  scope_tests:
    name: process scope (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Git Bash 在三个平台上都能执行同一段命令；Windows 的 Job 语义由本机 runner 真实覆盖。
      - name: Run process scope tests
        shell: bash
        run: |
          set -euo pipefail
          env JAVA_HOME="$JAVA_HOME" mvn -B -ntp -pl harness/daemon -am test \
            -Dtest='ProcessScopeTest,BashCapabilityTest,ProcessTreeTest,WindowsCommandLineTest,WindowsJobScopeTest' \
            -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: harness/daemon/target/surefire-reports/
          if-no-files-found: ignore
