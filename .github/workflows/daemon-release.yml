# kk-studio Daemon GitHub Release.
#
# 推送 `v*` tag 时发布 Go Environment Daemon 的多平台可运行发行归档及其校验和、确定性元数据
# 与法律文件。发布前必须通过仓库质量门禁与 Go daemon CI，且 tag 必须落在 `main` 的历史上，
# 确保发布物对应已经合入主分支、可精确追溯的提交。
#
# 上传只使用 workflow 自带的 `github.token`（`contents: write`），不使用 PAT，也不读取
# 任何其它 secret；发布物本身不含凭证。资产集合由 `scripts/daemon/prepare-release.sh`
# 唯一定义，本工作流只负责把它产出的文件原样上传：多一个或少一个都直接失败。
name: daemon-release

on:
  push:
    tags:
      - 'v*'
  # 手动触发只做候选验收：完整跑 stage 与五平台归档烟测，但 publish job 永不执行，
  # 因此可以在正式打 tag 之前用真实归档验收宿主环境。
  workflow_dispatch:
    inputs:
      tag:
        description: 待验收版本标识（例如 v1.2.3）；只暂存与烟测，不创建标签或发布。
        type: string
        required: true

# 发布不可并发：取消正在上传的 workflow 会留下半套资产。同一 ref 的重跑排队执行。
# 已发布 Release 的资产不重写：校验和完全一致则跳过，否则失败。只有草稿可以补齐资产。
concurrency:
  group: daemon-release-${{ github.ref }}
  cancel-in-progress: false

# 默认只读；只有真正写 Release 的 publish job 需要 contents: write。
permissions:
  contents: read

env:
  GO_VERSION: '1.27.4'
  GO_BIN: go
  POSTGRES_VERSION: '17'
  # push tag 用真实 tag，workflow_dispatch 用输入 tag 做候选验收。资产名、版本门禁与
  # Release 命令都只通过它取值，input 绝不直接拼进 shell。
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # 每个平台在 daemon-go/release/<os>-<arch> 下产出一套资产；工作流的资产校验与上传只读这些目录。
  RELEASE_ROOT: daemon-go/release
  # 官方 Daemon 发行归档覆盖的平台矩阵（windows 只支持 amd64）。
  RELEASE_PLATFORMS: linux-amd64 linux-arm64 macos-amd64 macos-arm64 windows-amd64

jobs:
  # Formal tag releases and Docker builds share the Go daemon CI gates. Manual dispatch remains
  # a focused archive candidate: its script tests, staging and host smoke run without publishing.
  daemon_ci:
    name: Go daemon CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/daemon-go-ci.yml

  stage:
    name: build and stage daemon release
    needs:
      - daemon_ci
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.daemon_ci.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # 全量历史：父提交必须可达，否则无法判定 tag 是否落在 main 上。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Set up Go 1.27.4
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # tag 名会进入资产文件名，因此只接受只含安全字符的版本 tag。提交约束分事件：
      # tag push 必须在 origin/main 上（正式发布）；手动 dry run 的候选 HEAD 必须包含
      # origin/main，但绝不发布。其它事件一律拒绝。
      - name: Require a safe release tag on an approved commit
        id: tag
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if ! [[ "${tag}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "unsupported release tag (expected ^v[0-9A-Za-z._-]+$): ${tag}" >&2
            exit 1
          fi
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          git show-ref --verify --quiet refs/remotes/origin/main
          case "${GITHUB_EVENT_NAME}" in
            push)
              # 正式发布：tag 提交必须在 main 上，未合入 main 的 tag 不能发布。
              if ! git merge-base --is-ancestor "${commit}" refs/remotes/origin/main; then
                echo "release tag ${tag} (${commit}) is not an ancestor of origin/main" >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              # 候选验收：不发布，但候选提交必须包含当前的 origin/main。
              if ! git merge-base --is-ancestor refs/remotes/origin/main "${commit}"; then
                echo "manual release dry run (${commit}) does not contain origin/main" >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported release event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          source_date_epoch=$(git show -s --format=%ct "${commit}")
          echo "commit=${commit}" >>"${GITHUB_OUTPUT}"
          echo "source_date_epoch=${source_date_epoch}" >>"${GITHUB_OUTPUT}"

      # 通过门禁的提交才可能进入构建与发布步骤；任一门禁失败都会终止 workflow。
      - name: Scan for sensitive data
        run: node scripts/dev/verify/repository/check-sensitive-data.mjs
      # tag 事件中 actions/checkout 会把发布 tag 改写成指向提交的轻量 tag；先从 origin 恢复全部
      # 原始 tag，远端 ref 核对才一致，附注 tag 的消息也在扫描范围内。上一个发布 tag 作为基线：
      # 它可达的历史已随该次发布通过门禁或人工复核，本次只对之后新出现的高置信度命中失败。
      - name: Scan full Git history for sensitive data
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          git fetch --quiet origin '+refs/tags/*:refs/tags/*'
          previous=$(git describe --tags --abbrev=0 --match 'v*' 'HEAD^')
          node scripts/dev/verify/repository/check-sensitive-history.mjs \
            --remote-pr --fail-on-high --baseline "${previous}" --json "${RUNNER_TEMP}/sensitive-history.json"
      - name: Check documentation layout
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/dev/verify/repository/check.mjs
      # 版本对齐以仓库里的真实文件为准：根 POM 的 <version>、kk-studio.version 属性、daemon 包
      # 版本与发布 tag 必须完全一致。这里不写死任何版本号，因此改版本时不需要修改本工作流。
      - name: Verify the repository version alignment
        run: |
          set -euo pipefail
          node scripts/dev/verify/repository/check-version-alignment.mjs
      - name: Set up PostgreSQL client tools
        uses: ./.github/actions/postgres-client
      - name: Run repository script tests
        uses: ./.github/actions/repository-script-tests
        env:
          GO_BIN: go
        with:
          globs: scripts/daemon/tests/*.test.mjs scripts/dev/verify/repository/tests/check-version-alignment.test.mjs scripts/dev/verify/repository/tests/daemon-ci-contract.test.mjs scripts/dev/verify/repository/tests/workflow-action-pins.test.mjs scripts/dev/verify/repository/tests/workflow-validation-gates.test.mjs scripts/dev/verify/reliability/tests/daemon-entrypoint-contracts.test.mjs scripts/dev/verify/supply-chain/tests/supply-chain.test.mjs

      # Go CI owns compilation and tests; release staging compiles each supported archive target.
      # 唯一资产暂存实现：按平台矩阵产出归档，每个平台写进 daemon-go/release/<os>-<arch>。
      - name: Stage release assets
        run: |
          set -euo pipefail
          for platform in ${RELEASE_PLATFORMS}; do
            scripts/daemon/prepare-release.sh "${RELEASE_TAG}" "${platform%-*}" "${platform#*-}"
          done

      - name: Upload staged release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon-release-archives
          path: daemon-go/release
          retention-days: 1
          if-no-files-found: error

  smoke_archives:
    name: smoke staged archive (${{ matrix.platform }})
    needs: stage
    if: ${{ always() && needs.stage.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-amd64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download staged archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daemon-release-archives
          path: daemon-go/release
      # code-server 的 MSAL native broker (microsoft-authentication/dist/msal-node-runtime.node)
      # 链接 libmsalruntime.so，后者需要 WebKitGTK/libsecret 等宿主库；headless runner 默认缺少这些库。
      # 这些只是本烟测宿主的依赖，不是 Daemon 启动的通用要求，因此只在 linux-amd64 安装，
      # 且不因此缩小 .node 加载断言。
      - name: Install Linux native broker host libraries
        if: matrix.platform == 'linux-amd64'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-0 libsecret-1-0
      - name: Smoke-test this host archive
        shell: bash
        run: |
          set -euo pipefail
          archive="daemon-go/release/${{ matrix.platform }}/kk-studio-daemon-${RELEASE_TAG}-${{ matrix.platform }}.tar.gz"
          test -f "${archive}"
          case "${{ matrix.platform }}" in
            windows-*)
              powershell -NoProfile -NonInteractive -File scripts/daemon/smoke-archive.ps1 "${archive}"
              ;;
            *)
              scripts/daemon/smoke-archive.sh "${archive}"
              ;;
          esac

  publish:
    name: publish daemon release
    # 只有正式 tag push 才发布：workflow_dispatch 的候选验收必须跳过本 job。
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - stage
      - smoke_archives
    runs-on: ubuntu-latest
    # 唯一需要写 Release 的 job；其它 job 继承工作流默认的只读权限。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download staged archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daemon-release-archives
          path: daemon-go/release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 暂存目录刚被整体重建，因此这里列出的就是待上传的完整资产集合；集合必须与
          # 发布契约逐字相同，多一个或少一个都直接失败，绝不静默上传一部分。
          shopt -s nullglob
          expected_names=()
          assets=()
          for platform in ${RELEASE_PLATFORMS}; do
            dir="${RELEASE_ROOT}/${platform}"
            if [ ! -d "${dir}" ]; then
              echo "missing staged platform directory: ${dir}" >&2
              exit 1
            fi
            actual=()
            for path in "${dir}"/*; do
              [ -f "${path}" ] && actual+=("${path##*/}")
            done
            actual=$(printf '%s\n' "${actual[@]}" | LC_ALL=C sort)
            os=${platform%-*}
            arch=${platform#*-}
            platform_expected=$(printf '%s\n' \
              "kk-studio-daemon-${RELEASE_TAG}-${os}-${arch}.tar.gz" \
              "kk-studio-daemon-${RELEASE_TAG}-${os}-${arch}.tar.gz.sha256" \
              "kk-studio-daemon-${RELEASE_TAG}-${os}-${arch}.json" \
              LICENSE THIRD_PARTY_NOTICES | LC_ALL=C sort)
            if [ "${actual}" != "${platform_expected}" ]; then
              echo "staged assets for ${platform} do not match the release contract" >&2
              printf 'actual:\n%s\nexpected:\n%s\n' "${actual}" "${platform_expected}" >&2
              exit 1
            fi
          done

          # LICENSE 与 THIRD_PARTY_NOTICES 在五个平台目录中内容一致，各只上传一份。
          for name in LICENSE THIRD_PARTY_NOTICES; do
            expected_names+=("${name}")
            assets+=("${RELEASE_ROOT}/linux-amd64/${name}")
          done
          for platform in ${RELEASE_PLATFORMS}; do
            os=${platform%-*}
            arch=${platform#*-}
            for suffix in ".tar.gz" ".tar.gz.sha256" ".json"; do
              name="kk-studio-daemon-${RELEASE_TAG}-${os}-${arch}${suffix}"
              expected_names+=("${name}")
              assets+=("${RELEASE_ROOT}/${platform}/${name}")
            done
          done

          expected=$(printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort)

          # 跨平台目录内同名的法律文件必须逐字一致，避免不同平台带上不同许可。
          for platform in ${RELEASE_PLATFORMS}; do
            for name in LICENSE THIRD_PARTY_NOTICES; do
              local_digest=$(sha256sum "${RELEASE_ROOT}/${platform}/${name}" | awk '{ print $1 }')
              canonical_digest=$(sha256sum "${RELEASE_ROOT}/linux-amd64/${name}" | awk '{ print $1 }')
              if [ "${local_digest}" != "${canonical_digest}" ]; then
                echo "${name} differs across platforms at ${platform}" >&2
                exit 1
              fi
            done
          done

          if gh release view "${RELEASE_TAG}" --json isDraft,assets >/dev/null 2>&1; then
            draft=$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')
            remote_names=$(gh release view "${RELEASE_TAG}" --json assets \
              --jq '.assets[].name' | LC_ALL=C sort)
            compare_remote=true
            upload_names=()
            if [ "${draft}" != "true" ]; then
              # 已发布资产不可替换。全部校验和一致才是一次无操作重跑。
              if [ "${remote_names}" != "${expected}" ]; then
                echo "published release assets differ from the staged set; refusing to replace them" >&2
                exit 1
              fi
            elif [ -n "${remote_names}" ]; then
              # 草稿可以补齐缺失资产，但不能覆盖已有内容，也不能带着额外资产发布。
              while IFS= read -r name; do
                case $'\n'"${expected}"$'\n' in
                  *$'\n'"${name}"$'\n'*) ;;
                  *)
                    echo "draft release has an asset outside the release contract: ${name}" >&2
                    exit 1
                    ;;
                esac
              done <<<"${remote_names}"
            fi
            if [ "${draft}" = "true" ]; then
              compare_remote=false
              if [ -n "${remote_names}" ]; then
                for name in "${expected_names[@]}"; do
                  case $'\n'"${remote_names}"$'\n' in
                    *$'\n'"${name}"$'\n'*) compare_remote=true ;;
                    *) upload_names+=("${name}") ;;
                  esac
                done
              else
                upload_names=("${expected_names[@]}")
              fi
            fi
            if [ "${compare_remote}" = true ]; then
              for name in "${expected_names[@]}"; do
                if [ "${draft}" = "true" ]; then
                  case $'\n'"${remote_names}"$'\n' in
                    *$'\n'"${name}"$'\n'*) ;;
                    *) continue ;;
                  esac
                fi
                asset_path=$(
                  for path in "${assets[@]}"; do
                    case "${path}" in */"${name}") echo "${path}"; break ;; esac
                  done
                )
                [ -n "${asset_path}" ] || { echo "cannot locate staged asset ${name}" >&2; exit 1; }
                url=$(gh release view "${RELEASE_TAG}" --json assets \
                  --jq ".assets[] | select(.name == \"${name}\") | .url")
                [ -n "${url}" ] || { echo "cannot read release asset ${name}" >&2; exit 1; }
                checksum=$(mktemp)
                if ! gh api "${url}" >"${checksum}"; then
                  rm -f "${checksum}"
                  echo "cannot read release asset ${name}" >&2
                  exit 1
                fi
                remote=$(sha256sum "${checksum}" | awk '{ print $1 }')
                rm -f "${checksum}"
                local_digest=$(sha256sum "${asset_path}" | awk '{ print $1 }')
                if [ "${remote}" != "${local_digest}" ]; then
                  echo "release asset ${name} differs from the staged asset; refusing to replace it" >&2
                  exit 1
                fi
              done
            fi
            if [ "${draft}" != "true" ]; then
              echo "published release already has the staged assets"
              exit 0
            fi
            if [ "${#upload_names[@]}" -gt 0 ]; then
              pending=()
              for name in "${upload_names[@]}"; do
                for path in "${assets[@]}"; do
                  case "${path}" in */"${name}") pending+=("${path}"); break ;; esac
                done
              done
              gh release upload "${RELEASE_TAG}" "${pending[@]}"
            fi
            gh release edit "${RELEASE_TAG}" --draft=false
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              "${assets[@]}"
            gh release edit "${RELEASE_TAG}" --draft=false
          fi
