# kk-studio Daemon GitHub Release.
#
# 推送 `v*` tag 时发布 Environment Daemon 的可执行单文件 JAR 及其校验和、确定性元数据与
# 法律文件。发布前必须通过仓库质量门禁，且 tag 必须落在 `main` 的历史上，确保发布物
# 对应已经合入主分支、可精确追溯的提交。
#
# 上传只使用 workflow 自带的 `github.token`（`contents: write`），不使用 PAT，也不读取
# 任何其它 secret；发布物本身不含凭证。资产集合由
# `scripts/daemon/prepare-release.sh` 唯一定义，本工作流只负责把它产出的文件
# 原样上传：多一个或少一个都直接失败。
name: daemon-release

on:
  push:
    tags:
      - 'v*'

# 发布不可并发：取消正在上传的 workflow 会留下半套资产。同一 ref 的重跑排队执行。
# 已发布 Release 的资产不重写：校验和完全一致则跳过，否则失败。只有草稿可以补齐资产。
concurrency:
  group: daemon-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24.14.0'
  # 暂存产物的唯一来源；工作流的资产校验与上传都只读这个目录。
  RELEASE_DIR: harness/daemon/target/release

jobs:
  validate_unix_daemon:
    name: validate Unix daemon installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test installer with system Bash
        # macOS /bin/bash is 3.2; fixtures never register real host services.
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          /bin/bash --version
          python3 -m unittest discover -s scripts/daemon/tests -p test_daemon_install.py
          python3 -m unittest discover -s scripts/daemon/tests -p test_daemon_install_macos.py
          python3 -m unittest discover -s scripts/daemon/tests -p test_daemon_download.py

  validate_windows_daemon:
    name: validate Windows daemon installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\daemon\tests\test_daemon_install_windows.ps1
      - name: Test installer with PowerShell 7
        # A failed PS 5.1 test must not hide PS 7 failures; the job still fails closed.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\scripts\daemon\tests\test_daemon_install_windows.ps1

  publish:
    name: build, stage and publish daemon release
    needs:
      - validate_windows_daemon
      - validate_unix_daemon
    runs-on: ubuntu-latest
    steps:
      # 全量历史：父提交必须可达，否则无法判定 tag 是否落在 main 上。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # tag 名会进入资产文件名，因此只接受只含安全字符的版本 tag；tag 提交必须是
      # origin/main 的祖先，未合入 main 的 tag 不能发布。
      - name: Require a safe version tag on a main commit
        id: tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "${tag}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "unsupported release tag (expected ^v[0-9A-Za-z._-]+$): ${tag}" >&2
            exit 1
          fi
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          git show-ref --verify --quiet refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${commit}" refs/remotes/origin/main; then
            echo "release tag ${tag} (${commit}) is not an ancestor of origin/main" >&2
            exit 1
          fi
          source_date_epoch=$(git show -s --format=%ct "${commit}")
          echo "commit=${commit}" >>"${GITHUB_OUTPUT}"
          echo "source_date_epoch=${source_date_epoch}" >>"${GITHUB_OUTPUT}"

      # 通过门禁的提交才可能进入构建与发布步骤；任一门禁失败都会终止 workflow。
      - name: Scan for sensitive data
        run: python3 scripts/dev/verify/repository/check-sensitive-data.py
      - name: Check documentation layout
        run: node scripts/dev/verify/repository/check.mjs
      - name: Run repository script tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 每个能力的测试都放在自己的 tests/ 目录；CI 只发现目录，不维护能力清单。
          python_dirs=(scripts/*/tests scripts/dev/verify/*/tests)
          node_files=(scripts/*/tests/*.test.mjs scripts/dev/verify/*/tests/*.test.mjs)
          if [ "${#python_dirs[@]}" -eq 0 ] || [ "${#node_files[@]}" -eq 0 ]; then
            echo "no script tests discovered below scripts/" >&2
            exit 1
          fi
          python_ran=0
          for dir in "${python_dirs[@]}"; do
            if [ -z "$(find "${dir}" -name 'test_*.py' -print -quit)" ]; then
              continue
            fi
            python3 -m unittest discover -s "${dir}"
            python_ran=1
          done
          [ "${python_ran}" -eq 1 ] || {
            echo "no python script tests discovered below scripts/" >&2
            exit 1
          }
          node --test "${node_files[@]}"
      - name: Verify the daemon module
        run: >-
          env JAVA_HOME="$JAVA_HOME" mvn -B -ntp -pl harness/daemon -am
          -Dproject.build.outputTimestamp="${{ steps.tag.outputs.source_date_epoch }}"
          clean verify

      # 唯一资产暂存实现：校验可执行单文件 JAR 后，把资产写进 RELEASE_DIR。
      - name: Stage release assets
        run: scripts/daemon/prepare-release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 暂存目录刚被整体重建，因此这里列出的就是待上传的完整资产集合；集合必须与
          # 发布契约逐字相同，多一个或少一个都直接失败，绝不静默上传一部分。
          shopt -s nullglob
          expected_names=(
            LICENSE
            THIRD_PARTY_NOTICES
            "kk-studio-daemon-${GITHUB_REF_NAME}.jar"
            "kk-studio-daemon-${GITHUB_REF_NAME}.jar.sha256"
            "kk-studio-daemon-${GITHUB_REF_NAME}.json"
          )
          actual=()
          for path in "${RELEASE_DIR}"/*; do
            if [ -f "${path}" ]; then
              actual+=("${path##*/}")
            fi
          done
          actual=$(printf '%s\n' "${actual[@]}" | LC_ALL=C sort)
          expected=$(printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort)
          if [ "${actual}" != "${expected}" ]; then
            echo "staged assets do not match the release contract" >&2
            printf 'actual:\n%s\n' "${actual}" >&2
            printf 'expected:\n%s\n' "${expected}" >&2
            exit 1
          fi
          assets=()
          for name in "${expected_names[@]}"; do
            assets+=("${RELEASE_DIR}/${name}")
          done

          if gh release view "${GITHUB_REF_NAME}" --json isDraft,assets >/dev/null 2>&1; then
            draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')
            remote_names=$(gh release view "${GITHUB_REF_NAME}" --json assets \
              --jq '.assets[].name' | LC_ALL=C sort)
            compare_remote=true
            upload_names=()
            if [ "${draft}" != "true" ]; then
              # 已发布资产不可替换。五个校验和都一致才是一次无操作重跑。
              if [ "${remote_names}" != "${expected}" ]; then
                echo "published release assets differ from the staged set; refusing to replace them" >&2
                exit 1
              fi
            elif [ -n "${remote_names}" ]; then
              # 草稿可以补齐缺失资产，但不能覆盖已有内容，也不能带着额外资产发布。
              while IFS= read -r name; do
                case $'\n'"${expected}"$'\n' in
                  *$'\n'"${name}"$'\n'*) ;;
                  *)
                    echo "draft release has an asset outside the release contract: ${name}" >&2
                    exit 1
                    ;;
                esac
              done <<<"${remote_names}"
            fi
            if [ "${draft}" = "true" ]; then
              compare_remote=false
              if [ -n "${remote_names}" ]; then
                for name in "${expected_names[@]}"; do
                  case $'\n'"${remote_names}"$'\n' in
                    *$'\n'"${name}"$'\n'*) compare_remote=true ;;
                    *) upload_names+=("${name}") ;;
                  esac
                done
              else
                upload_names=("${expected_names[@]}")
              fi
            fi
            if [ "${compare_remote}" = true ]; then
              for name in "${expected_names[@]}"; do
                if [ "${draft}" = "true" ]; then
                  case $'\n'"${remote_names}"$'\n' in
                    *$'\n'"${name}"$'\n'*) ;;
                    *) continue ;;
                  esac
                fi
                url=$(gh release view "${GITHUB_REF_NAME}" --json assets \
                  --jq ".assets[] | select(.name == \"${name}\") | .url")
                [ -n "${url}" ] || { echo "cannot read release asset ${name}" >&2; exit 1; }
                checksum=$(mktemp)
                if ! gh api "${url}" >"${checksum}"; then
                  rm -f "${checksum}"
                  echo "cannot read release asset ${name}" >&2
                  exit 1
                fi
                remote=$(sha256sum "${checksum}" | awk '{ print $1 }')
                rm -f "${checksum}"
                local_digest=$(sha256sum "${RELEASE_DIR}/${name}" | awk '{ print $1 }')
                if [ "${remote}" != "${local_digest}" ]; then
                  echo "release asset ${name} differs from the staged asset; refusing to replace it" >&2
                  exit 1
                fi
              done
            fi
            if [ "${draft}" != "true" ]; then
              echo "published release already has the staged assets"
              exit 0
            fi
            if [ "${#upload_names[@]}" -gt 0 ]; then
              pending=()
              for name in "${upload_names[@]}"; do
                pending+=("${RELEASE_DIR}/${name}")
              done
              gh release upload "${GITHUB_REF_NAME}" "${pending[@]}"
            fi
            gh release edit "${GITHUB_REF_NAME}" --draft=false
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              "${assets[@]}"
            gh release edit "${GITHUB_REF_NAME}" --draft=false
          fi
