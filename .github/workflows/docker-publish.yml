# kk-studio Docker publish.
#
# 两个分支发布同一个已打包应用镜像 `deploy/local/Dockerfile`（Fat JAR + 内嵌前端），
# 镜像仓库同为 `kk-studio`：`main` 先跑全量仓库门禁与五平台 Daemon 矩阵再发布用户使用的
# `:main`，`dev` 只发布 NAS 自迭代使用的 `:dev`（质量检查在提交前的独立工作流完成）。
# 两者都以 linux/amd64 推送 `:<branch>` 与 `:<commit-sha>` 两个 tag。质量门禁包含前端
# 覆盖率与离线浏览器布局回归（不访问后端或模型）；真实模型 E2E、真实端到端 UI E2E 不在
# 本文工作流内。
#
# Registry credential 只来自 Actions secrets，不作为 build arg、不进入 image layer
# 或 build log。
name: docker-publish

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run all repository and daemon platform gates without publishing an image
        type: boolean
        default: false

concurrency:
  group: docker-publish-${{ github.ref }}-${{ inputs.validate_only && 'validate' || 'publish' }}
  # 频繁 push dev 时只允许最新提交发布可变 `:dev` tag，避免较老 workflow 后完成并回退镜像。
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24.21.0'
  POSTGRES_VERSION: '17'

jobs:
  # 五平台 Daemon 平台门禁与安装器宿主验收由可复用工作流提供：main 发布镜像前必须通过，
  # dev 只发布镜像，不需要等待该矩阵（改动 daemon/** 时 daemon-ci 仍会独立触发）。
  daemon_ci:
    name: node daemon matrix
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)
    uses: ./.github/workflows/daemon-ci.yml

  # 安装器宿主验收：Daemon 本体由 daemon-ci 的五平台矩阵覆盖，安装器/归档 fixture 还必须在
  # 目标宿主系统 Bash 与两个 PowerShell 版本下真跑一次，main 才允许发布镜像。
  validate_unix_daemon:
    name: validate Unix daemon installer (${{ matrix.os }})
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node 24.21
        # 安装器/归档 fixture 从 daemon 的锁定依赖里加载真实 tar 解析器。
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - name: Install daemon dependencies
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: npm --prefix daemon ci
      - name: Test installer with system Bash
        # macOS 的 /bin/bash 是 3.2：既不用 runner 默认 Bash，也不用 Homebrew Bash。
        # fixture 只记录服务操作，不注册 systemd/launchd 服务，也不访问网络。
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          /bin/bash --version
          node --test scripts/daemon/tests/*.test.mjs

  validate_windows_daemon:
    name: validate Windows daemon installer
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node 24.21
        # Windows fixture 用 runner 上的真实 node.exe 构建归档。
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\daemon\tests\test_daemon_install_windows.ps1
      - name: Test installer with PowerShell 7
        # 两个宿主的结论都要收集：PS 5.1 失败也不隐藏 PS 7 的失败，任一失败都阻断发布。
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\scripts\daemon\tests\test_daemon_install_windows.ps1
      - name: Install frontend dependencies
        shell: bash
        run: npm --prefix frontend ci
      - name: Test generated Windows install command natively
        # 前端生成的单行安装命令在两种 PowerShell 宿主里真跑一次。
        shell: bash
        run: npm --prefix frontend run test:install:windows

  validate:
    name: validate repository
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Set up Node 24.21
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            daemon/package-lock.json
      - name: Set up PostgreSQL client tools
        run: |
          set -euo pipefail
          # Ubuntu's default repositories do not provide every supported PostgreSQL major.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --retry 3 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            "Architectures: $(dpkg --print-architecture)" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "postgresql-client-${POSTGRES_VERSION}"
          # Match the real PostgreSQL fixture; runner defaults may point pg_dump at an older major.
          echo "/usr/lib/postgresql/${POSTGRES_VERSION}/bin" >> "${GITHUB_PATH}"
      - name: Verify PostgreSQL client selection
        run: |
          set -euo pipefail
          for tool in psql pg_dump pg_restore createdb pg_isready; do
            test "$(command -v "${tool}")" = "/usr/lib/postgresql/${POSTGRES_VERSION}/bin/${tool}"
            "${tool}" --version
          done
      # Fail fast on tooling and script contracts before the full Java/frontend builds.
      - name: Check documentation layout
        run: node scripts/dev/verify/repository/check.mjs
      - name: Install daemon dependencies
        # 仓库脚本 fixture 使用真实 daemon 依赖（含 tar 解析器）与真实 Node 入口。
        run: npm --prefix daemon ci
      - name: Run repository script tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 每个能力的测试都放在自己的 tests/ 目录；CI 只发现 *.test.mjs，不维护能力清单。
          node_files=(scripts/*/tests/*.test.mjs scripts/dev/verify/*/tests/*.test.mjs deploy/test/mock/*.test.mjs)
          if [ "${#node_files[@]}" -eq 0 ]; then
            echo "no script tests discovered below scripts/" >&2
            exit 1
          fi
          node --test "${node_files[@]}"
      - name: Scan for sensitive data
        run: node scripts/dev/verify/repository/check-sensitive-data.mjs
      - name: Verify Java sources, tests and coverage
        run: env JAVA_HOME="$JAVA_HOME" mvn -B -ntp verify
      - name: Verify Java update commands with the Node decoder
        # Java producer 的产物由上一步全量 verify 写入 harness/environment/target；这里用同一份产物驱动生产 Node
        # decoder，两端对共享 fixture 的接受/拒绝集合不一致即阻断发布。
        run: |
          set -euo pipefail
          npm --prefix daemon run build
          node scripts/daemon/verify-java-update-commands.mjs harness/environment/target/daemon-update-java-commands.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Check frontend test and browser types
        run: npm --prefix frontend run typecheck:test
      - name: Verify frontend coverage
        run: npm --prefix frontend run coverage
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Install layout browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Test frontend layout
        run: npm --prefix frontend run test:layout
      - name: Upload frontend diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-diagnostics
          path: |
            frontend/coverage/
            reports/layout/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: build and push image
    needs:
      - validate
      - daemon_ci
      - validate_unix_daemon
      - validate_windows_daemon
    # `main` 必须全量门禁、五平台 Daemon 矩阵与安装器宿主验收都通过才发布；其他分支的这四个
    # 门禁按设计为 skipped，仍可直接发布。失败或取消的 Main 门禁绝不能被 `always()` 绕过。
    if: >-
      ${{
        always()
        && !cancelled()
        && !(github.event_name == 'workflow_dispatch' && inputs.validate_only)
        && (
          (github.ref_name == 'main'
            && needs.validate.result == 'success'
            && needs.daemon_ci.result == 'success'
            && needs.validate_unix_daemon.result == 'success'
            && needs.validate_windows_daemon.result == 'success')
          || (github.ref_name != 'main'
              && needs.validate.result == 'skipped'
              && needs.daemon_ci.result == 'skipped'
              && needs.validate_unix_daemon.result == 'skipped'
              && needs.validate_windows_daemon.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Require the publish namespace secret
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_NAMESPACE}" ]; then
            echo "DOCKERHUB_NAMESPACE secret must be configured" >&2
            exit 1
          fi
      # Branch -> mutable target map. Both branches publish the same packaged app
      # image; only the mutable tag differs. Anything else fails instead of guessing.
      - name: Select image target from the pushed branch
        id: target
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main)
              echo "tag=main" >> "${GITHUB_OUTPUT}"
              ;;
            dev)
              echo "tag=dev" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "unsupported publish branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/local/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAMESPACE }}/kk-studio:${{ steps.target.outputs.tag }}
            ${{ secrets.DOCKERHUB_NAMESPACE }}/kk-studio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
