# kk-studio Docker publish.
#
# 两个分支发布同一个已打包应用镜像 `deploy/local/Dockerfile`（Fat JAR + 内嵌前端），
# 镜像仓库同为 `kk-studio`：`main` 先跑仓库质量门禁再发布用户使用的 `:main`，`dev`
# 的检查在提交前完成，push 后直接发布 NAS 自迭代使用的 `:dev`。两者都以 linux/amd64
# 推送 `:<branch>` 与 `:<commit-sha>` 两个 tag；真实模型 E2E、UI E2E 等付费/长耗时检查
# 不在本文工作流内。
#
# Registry credential 只来自 Actions secrets，不作为 build arg、不进入 image layer
# 或 build log。
name: docker-publish

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  # 频繁 push dev 时只允许最新提交发布可变 `:dev` tag，避免较老 workflow 后完成并回退镜像。
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24.14.0'

jobs:
  validate:
    name: validate repository
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Java sources, tests and coverage
        run: mvn -B -ntp verify
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Test frontend
        run: npm --prefix frontend run test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Check documentation layout
        run: node scripts/docs/check.mjs
      - name: Run repository script contracts
        run: |
          python3 -m unittest discover -s scripts/e2e/tests
          node --test scripts/e2e/tests/*.test.mjs
          node --test scripts/supply-chain/tests/*.test.mjs
      - name: Scan for sensitive data
        run: python3 scripts/security/check-sensitive-data.py

  publish:
    name: build and push image
    needs: validate
    # `main` 只能在全量门禁成功后发布；`dev` 的 validate job 按设计为 skipped，
    # 仍可直接发布。失败或取消的 Main 门禁绝不能被 `always()` 绕过。
    if: >-
      ${{
        always()
        && !cancelled()
        && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Require the publish namespace secret
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_NAMESPACE}" ]; then
            echo "DOCKERHUB_NAMESPACE secret must be configured" >&2
            exit 1
          fi
      # Branch -> mutable target map. Both branches publish the same packaged app
      # image; only the mutable tag differs. Anything else fails instead of guessing.
      - name: Select image target from the pushed branch
        id: target
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main)
              echo "tag=main" >> "${GITHUB_OUTPUT}"
              ;;
            dev)
              echo "tag=dev" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "unsupported publish branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/local/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAMESPACE }}/kk-studio:${{ steps.target.outputs.tag }}
            ${{ secrets.DOCKERHUB_NAMESPACE }}/kk-studio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
