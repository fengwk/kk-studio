# kk-studio Docker publish.
#
# 两个分支发布同一个已打包应用镜像 `deploy/local/Dockerfile`（Fat JAR + 内嵌前端），
# 镜像仓库同为 `kk-studio`：`main` 先跑全量仓库门禁、前端门禁与五平台 Daemon 矩阵再发布
# 用户使用的 `:main`，`dev` 只发布 NAS 自迭代使用的 `:dev`。两者都以 linux/amd64 推送
# `:<branch>` 与 `:<commit-sha>` 两个 tag。
#
# 每次触发先跑低成本的版本/文档/敏感数据 preflight。`main` 随后并行执行 Java 仓库门禁、
# 前端门禁与 daemon-ci 五平台矩阵；Java 门禁只构建一次带内嵌前端的发行 Fat JAR，并把它与
# 匹配的 convention4j agent 作为同 run artifact 交给 publish。`dev` 不跑全量门禁，直接从
# 源码构建镜像。真实模型 E2E 与真实端到端 UI E2E 不在本文工作流内。
#
# Registry credential 只来自 Actions secrets，不作为 build arg、不进入 image layer
# 或 build log。
name: docker-publish

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run all repository and daemon platform gates without publishing an image
        type: boolean
        default: false

concurrency:
  group: docker-publish-${{ github.ref }}-${{ inputs.validate_only && 'validate' || 'publish' }}
  # 频繁 push dev 时只允许最新提交发布可变 `:dev` tag，避免较老 workflow 后完成并回退镜像。
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24.21.0'
  POSTGRES_VERSION: '17'

jobs:
  # 版本、文档与敏感数据检查足够便宜，先于所有重门禁运行；dev 也不跳过版本一致性。
  preflight:
    name: version and repository preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node 24.21
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify the repository version alignment
        # 不传 RELEASE_TAG：这里校验仓库内部版本事实源，tag 对齐由 daemon-release 负责。
        run: node scripts/dev/verify/repository/check-version-alignment.mjs
      - name: Check documentation layout
        run: node scripts/dev/verify/repository/check.mjs
      - name: Scan for sensitive data
        run: node scripts/dev/verify/repository/check-sensitive-data.mjs

  # 五平台 Daemon 平台门禁与安装器宿主验收由可复用工作流提供：main 发布镜像前必须通过，
  # dev 只发布镜像，不需要等待该矩阵；改动 daemon/** 时 PR 门禁仍会独立触发。
  daemon_ci:
    name: node daemon matrix
    needs: preflight
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)
    uses: ./.github/workflows/daemon-ci.yml

  validate:
    name: validate repository
    needs: preflight
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Set up Node 24.21
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            daemon/package-lock.json
      - name: Set up PostgreSQL client tools
        run: |
          set -euo pipefail
          # Ubuntu's default repositories do not provide every supported PostgreSQL major.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --retry 3 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            "Architectures: $(dpkg --print-architecture)" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "postgresql-client-${POSTGRES_VERSION}"
          # Match the real PostgreSQL fixture; runner defaults may point pg_dump at an older major.
          echo "/usr/lib/postgresql/${POSTGRES_VERSION}/bin" >> "${GITHUB_PATH}"
      - name: Verify PostgreSQL client selection
        run: |
          set -euo pipefail
          for tool in psql pg_dump pg_restore createdb pg_isready; do
            test "$(command -v "${tool}")" = "/usr/lib/postgresql/${POSTGRES_VERSION}/bin/${tool}"
            "${tool}" --version
          done
      - name: Install daemon dependencies
        # 仓库脚本 fixture 使用真实 daemon 依赖（含 tar 解析器）与真实 Node 入口。
        run: npm --prefix daemon ci
      - name: Build daemon transport for Java integration tests
        # Web 反向流测试启动真实 Node 进程，必须先生成同一提交的 daemon/dist。
        run: npm --prefix daemon run build
      - name: Run repository script tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 每个能力的测试都放在自己的 tests/ 目录；CI 只发现 *.test.mjs，不维护能力清单。
          node_files=(scripts/*/tests/*.test.mjs scripts/dev/verify/*/tests/*.test.mjs deploy/test/mock/*.test.mjs)
          if [ "${#node_files[@]}" -eq 0 ]; then
            echo "no script tests discovered below scripts/" >&2
            exit 1
          fi
          node --test "${node_files[@]}"
      - name: Pull the isolated PostgreSQL baseline image
        # The schema checker runs with --pull=never; pull the pinned image explicitly first.
        run: docker pull postgres:17.10
      - name: Verify the sole V1 baseline on a fresh PostgreSQL
        # Loads the real migration into an owned, network-isolated container and checks the full
        # table inventory, target columns/relations/indexes and the shared SQL probes.
        run: node scripts/dev/verify/repository/check-canvas-project-schema.mjs
      - name: Verify Java sources, tests, coverage and package the distribution JAR
        # -Pdistribution 在同一个 reactor 中安装前端工具链并只打包一次带内嵌 React 产物的
        # 发行 Fat JAR；后续启动、decoder、agent 提取与镜像发布都复用这个产物。
        run: env JAVA_HOME="$JAVA_HOME" mvn -B -ntp -Pdistribution verify
      - name: Resolve the distribution Fat JAR
        id: distribution
        run: |
          set -euo pipefail
          version="$(node -e "const m = /<artifactId>kk-studio-parent<\/artifactId>\s*<version>([^<]+)<\/version>/.exec(require('node:fs').readFileSync('pom.xml', 'utf8')); if (!m) throw new Error('root POM version not found'); process.stdout.write(m[1])")"
          jar="$PWD/web/target/kk-studio-web-${version}.jar"
          test -f "${jar}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "jar=${jar}" >> "${GITHUB_OUTPUT}"
      - name: Verify the current startup Fat JAR and legacy rejection
        # 用同一个发行 Fat JAR 验证当前空库启动、HTTP 读取与旧库拒绝；JAR 路径仍由根 POM
        # 的当前版本决定，不另建版本事实源。
        env:
          APP_JAR: ${{ steps.distribution.outputs.jar }}
        run: |
          set -euo pipefail
          env JAVA_HOME="$JAVA_HOME" mvn -B -ntp -pl web -am test \
            -Dtest=WebApplicationStartupSubprocessTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            "-Dkkstudio.startup.test.jar=${APP_JAR}"
      - name: Verify Java update commands with the Node decoder
        # Java producer 的产物由同一次 distribution verify 写入 harness/environment/target；
        # 这里用同一份产物驱动生产 Node decoder，两端对共享 fixture 的接受/拒绝集合必须一致。
        run: |
          set -euo pipefail
          node scripts/daemon/verify-java-update-commands.mjs harness/environment/target/daemon-update-java-commands.json
      - name: Stage the verified distribution artifact
        # 只把已验收的 Fat JAR、匹配的 convention4j agent 与版本/提交/摘要清单放进 artifact；
        # 上传目录由脚本重建为封闭文件集合，不包含工作树、环境或凭据。
        env:
          APP_VERSION: ${{ steps.distribution.outputs.version }}
          APP_JAR: ${{ steps.distribution.outputs.jar }}
        run: |
          set -euo pipefail
          agent="$RUNNER_TEMP/convention4j-agent/convention4j-agent.jar"
          mkdir -p "$(dirname "${agent}")"
          sh scripts/dev/lib/extract-convention4j-agent.sh "$(command -v jar)" "${APP_JAR}" "${agent}"
          node scripts/dev/ci/app-artifact.mjs stage \
            --jar "${APP_JAR}" \
            --agent "${agent}" \
            --output "$RUNNER_TEMP/verified-app" \
            --version "${APP_VERSION}" \
            --source-commit "$GITHUB_SHA"
      - name: Upload the verified distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # 绑定当前 run 的提交 SHA；publish 只按同 SHA 从本 run 下载，不查找“最近成功”。
          name: kk-studio-app-${{ github.sha }}
          path: ${{ runner.temp }}/verified-app/
          retention-days: 1
          if-no-files-found: error

  validate_frontend:
    name: validate frontend
    needs: preflight
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node 24.21
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Check frontend test and browser types
        run: npm --prefix frontend run typecheck:test
      - name: Verify frontend coverage
        run: npm --prefix frontend run coverage
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Install browser binaries
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Test frontend browser suites
        run: npm --prefix frontend run test:browser
      - name: Upload frontend diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-diagnostics
          path: |
            frontend/coverage/
            reports/browser-site/
            reports/layout/
            reports/pane/
            reports/install-browser/
            reports/browser/
            reports/composer-editor/
            reports/compaction/
            reports/subagent-tree/
            reports/tool-card/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: build and push image
    needs:
      - preflight
      - validate
      - validate_frontend
      - daemon_ci
    # `main` 必须 preflight、Java、前端与五平台 Daemon 矩阵全部成功才发布；其他分支的
    # 三个重门禁按设计为 skipped，preflight 仍必须成功。失败、取消或混合状态绝不能被
    # `always()` 绕过。
    if: >-
      ${{
        always()
        && !cancelled()
        && !(github.event_name == 'workflow_dispatch' && inputs.validate_only)
        && needs.preflight.result == 'success'
        && (
          (github.ref_name == 'main'
            && needs.validate.result == 'success'
            && needs.validate_frontend.result == 'success'
            && needs.daemon_ci.result == 'success')
          || (github.ref_name != 'main'
              && needs.validate.result == 'skipped'
              && needs.validate_frontend.result == 'skipped'
              && needs.daemon_ci.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node 24.21
        # publish 只解析 POM 并运行 artifact verifier，不安装依赖；仍固定显式 Node 主版本。
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Require the publish namespace secret
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_NAMESPACE}" ]; then
            echo "DOCKERHUB_NAMESPACE secret must be configured" >&2
            exit 1
          fi
      # Branch -> mutable target map. Both branches publish the same packaged app
      # image; only the mutable tag differs. Anything else fails instead of guessing.
      - name: Select image target from the pushed branch
        id: target
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main)
              echo "tag=main" >> "${GITHUB_OUTPUT}"
              ;;
            dev)
              echo "tag=dev" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "unsupported publish branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
      - name: Resolve the expected distribution version
        id: distribution
        run: |
          set -euo pipefail
          version="$(node -e "const m = /<artifactId>kk-studio-parent<\/artifactId>\s*<version>([^<]+)<\/version>/.exec(require('node:fs').readFileSync('pom.xml', 'utf8')); if (!m) throw new Error('root POM version not found'); process.stdout.write(m[1])")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Download the verified distribution artifact
        # 限本 run、本提交 SHA 的 artifact；不指定 run-id，也绝不查找最近一次成功 run。
        if: github.ref_name == 'main'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kk-studio-app-${{ github.sha }}
          path: ${{ runner.temp }}/verified-app
      - name: Verify the downloaded distribution artifact
        # 校验封闭文件集合、版本、source commit 与两份文件的 SHA256；缺失或损坏直接失败。
        if: github.ref_name == 'main'
        env:
          APP_VERSION: ${{ steps.distribution.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/dev/ci/app-artifact.mjs verify \
            --dir "$RUNNER_TEMP/verified-app" \
            --version "${APP_VERSION}" \
            --source-commit "$GITHUB_SHA"
      - name: Build and push linux/amd64 image from the verified artifact
        if: github.ref_name == 'main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # 只使用下载的 artifact 目录，显式选择 verified-artifact 阶段，不重新构建源码。
          context: ${{ runner.temp }}/verified-app
          file: ${{ github.workspace }}/deploy/local/Dockerfile
          target: verified-artifact
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAMESPACE }}/kk-studio:${{ steps.target.outputs.tag }}
            ${{ secrets.DOCKERHUB_NAMESPACE }}/kk-studio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push linux/amd64 image from source
        if: github.ref_name != 'main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # dev 保持原有策略：源码 context、Dockerfile 默认的 source 阶段。
          context: .
          file: deploy/local/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAMESPACE }}/kk-studio:${{ steps.target.outputs.tag }}
            ${{ secrets.DOCKERHUB_NAMESPACE }}/kk-studio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
