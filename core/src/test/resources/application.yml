spring:

  application:
    name: kk-studio

  flyway:
    enabled: false

  datasource:
    multi:
      primary:
        primary: true
        # 默认占位；PostgresSpringTestSupport / 集成测试通过 DynamicPropertySource 覆盖
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://127.0.0.1:1/unused
        username: unused
        password: unused

  data:
    redis:
      # 默认本地 Redis 占位；RedisSpringTestSupport 覆盖到 Testcontainers。
      host: 127.0.0.1
      port: 6379

  mybatis:
    mapper-locations: classpath:**/*Mapper.xml
    type-aliases-package: fun.fengwk.kkstudio.**.model
    configuration:
      map-underscore-to-camel-case: true


kk-studio:
  harness:
    runtime:
      workers-enabled: false
      environment-root: target/harness-environment
