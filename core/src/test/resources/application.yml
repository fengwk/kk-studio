spring:

  application:
    # 应用名称
    name: kk-studio

  sql:
    init:
      schema-locations:
        - classpath:schema-h2.sql
      data-locations:
        - classpath:data-h2.sql

  datasource:
    multi:
      primary:
        primary: true
        # 使用h2驱动
        driver-class-name: org.h2.Driver
        # 使用这个jdbc连接将会以MySQL模式连接到h2内存数据库
        url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
        # 指定的默认的用户名SA，防止h2出现认证异常
        # 详见，org.h2.engine.Database.setMasterUser
        username: SA

  mybatis:
    mapper-locations: classpath:**/*Mapper.xml
    type-aliases-package: fun.fengwk.kkstudio.**.model
    configuration:
      map-underscore-to-camel-case: true

convention:
  snowflake-id:
    # 雪花id开始时间，固定不可变
    initial-timestamp: 1702214261706
    # 测试固定 worker id，避免依赖外部 worker id 分配服务
    worker-id: 0

kk-studio:
  harness:
    runtime:
      workers-enabled: false

kk-circle:
  ai:
    image:
      gpt-image-2:
        url: https://webai2api.kk1.fun/api/gpt-image-2
        api-key: ${TOOLS_API_KEY}
        timeout-ms: 180000
