spring:

  application:
    name: kk-studio

  sql:
    init:
      mode: never

  datasource:
    multi:
      primary:
        primary: true
        # 默认占位；PostgresSpringTestSupport / 集成测试通过 DynamicPropertySource 覆盖
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://127.0.0.1:1/unused
        username: unused
        password: unused

  data:
    redis:
      # 默认本地 Redis 占位；RedisSpringTestSupport 覆盖到 Testcontainers。
      host: 127.0.0.1
      port: 6379

  mybatis:
    mapper-locations: classpath:**/*Mapper.xml
    type-aliases-package: fun.fengwk.kkstudio.**.model
    configuration:
      map-underscore-to-camel-case: true

convention:
  snowflake-id:
    initial-timestamp: 1702214261706
    # 测试固定 worker，避免非 Redis 套件依赖 worker 续租；生产见 application.yml Redis worker 策略。
    worker-id: 0

kk-studio:
  harness:
    runtime:
      workers-enabled: false

kk-circle:
  ai:
    image:
      gpt-image-2:
        url: https://webai2api.kk1.fun/api/gpt-image-2
        api-key: ${TOOLS_API_KEY}
        timeout-ms: 180000
